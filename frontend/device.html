<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07060e">
  <title>EnemFlow AI - Neste dispositivo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/feather-icons"></script>
  <script src="sidebar.js" defer></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','sans-serif'],sora:['Sora','sans-serif']}}}};</script>
  <style>
    body{font-family:'Inter',sans-serif}.device-shell{max-width:1180px;margin:0 auto;padding:2rem}.device-card{background:rgba(12,10,22,.88);border:1px solid rgba(255,255,255,.075);border-radius:18px;box-shadow:0 12px 36px rgba(0,0,0,.28)}
    .device-action{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:40px;padding:.65rem .9rem;border-radius:12px;font-weight:800;font-size:.82rem;color:#c4b5fd;border:1px solid rgba(124,92,252,.18);background:rgba(124,92,252,.065);transition:transform .2s ease}.device-action:hover{transform:translateY(-1px)}
    .subject-block{border-radius:18px;border:1px solid rgba(255,255,255,.075);background:rgba(255,255,255,.025);overflow:hidden}.subject-head{padding:1rem 1.1rem;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(124,92,252,.045)}.file-card{border-radius:14px;border:1px solid rgba(255,255,255,.075);background:rgba(255,255,255,.025);padding:1rem}.chip{display:inline-flex;padding:.3rem .55rem;border-radius:999px;border:1px solid rgba(124,92,252,.16);background:rgba(124,92,252,.06);color:#c4b5fd;font-size:.7rem;font-weight:800}
    @media(max-width:1023px){.device-shell{padding:1rem;padding-bottom:1.5rem}.device-action{width:100%}}
  </style>
  <link rel="icon" type="image/png" href="favicon.png?v=2">
</head>
<body class="min-h-screen ef-deep-bg">
  <main class="flex-1 overflow-y-auto relative min-h-screen">
    <div class="bg-glow" style="top:5%;right:5%;"></div>
    <div class="device-shell space-y-8 relative z-10 animate-fade-in">
      <header class="flex flex-col md:flex-row md:items-start md:justify-between gap-5">
        <div>
          <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-gradient" style="font-family:'Sora',sans-serif;">Neste dispositivo</h1>
          <p class="mt-2 max-w-2xl text-sm sm:text-base" style="color:rgba(196,188,220,.62);">PDFs e materiais gerados pela IA, organizados por materia, assunto, topico e data.</p>
        </div>
        <button onclick="window.location.href='exercises.html'" class="device-action"><i data-feather="zap" class="w-4 h-4"></i>Gerar simulado</button>
      </header>

      <section class="device-card p-5 md:p-6">
        <div class="grid grid-cols-1 md:grid-cols-[1fr_180px] gap-3">
          <input id="searchInput" type="text" class="ef-input" placeholder="Buscar por arquivo, materia, assunto ou topico..." oninput="renderFiles()">
          <select id="sortSelect" class="ef-select" onchange="renderFiles()">
            <option value="recent">Mais recentes</option>
            <option value="name">Nome</option>
            <option value="size">Tamanho</option>
          </select>
        </div>
      </section>

      <section id="deviceContent" class="space-y-5"></section>
    </div>
  </main>

  <script src="app.js"></script>
  <script src="pdf-tools.js"></script>
  <script>
    feather.replace();
    if(!App.getToken()) window.location.href='login.html';

    async function renderFiles(){
      const container=document.getElementById('deviceContent');
      if(!window.EnemFlowPdfTools){container.innerHTML=emptyState('Ferramentas de PDF indisponiveis.');return}
      const query=(document.getElementById('searchInput').value||'').toLowerCase();
      const sort=document.getElementById('sortSelect').value;
      let records=await EnemFlowPdfTools.listPdfRecords();
      records=records.filter(r=>[r.name,r.materia,r.assunto,r.topico,r.tipo].some(v=>String(v||'').toLowerCase().includes(query)));
      if(sort==='name') records.sort((a,b)=>a.name.localeCompare(b.name));
      if(sort==='size') records.sort((a,b)=>(b.size||0)-(a.size||0));
      if(!records.length){container.innerHTML=emptyState('Nenhum arquivo salvo neste dispositivo.');return}
      const grouped=groupRecords(records);
      container.innerHTML=Object.entries(grouped).map(([materia,assuntos])=>`
        <article class="subject-block">
          <div class="subject-head flex items-center justify-between gap-3">
            <h2 class="font-black text-lg" style="font-family:'Sora',sans-serif;color:#e4dff0;">${escapeHtml(materia)}</h2>
            <span class="chip">${countNested(assuntos)} arquivos</span>
          </div>
          <div class="p-4 md:p-5 space-y-5">
            ${Object.entries(assuntos).map(([assunto,topicos])=>`
              <section>
                <h3 class="font-black mb-3" style="font-family:'Sora',sans-serif;color:#c4b5fd;">${escapeHtml(assunto)}</h3>
                <div class="space-y-4">
                  ${Object.entries(topicos).map(([topico,files])=>`
                    <div>
                      <div class="flex items-center justify-between gap-2 mb-2">
                        <p class="text-sm font-bold" style="color:rgba(196,188,220,.72);">${escapeHtml(topico)}</p>
                        <span class="chip">${files.length}</span>
                      </div>
                      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        ${files.map(fileCard).join('')}
                      </div>
                    </div>
                  `).join('')}
                </div>
              </section>
            `).join('')}
          </div>
        </article>
      `).join('');
      feather.replace();
    }

    function groupRecords(records){
      return records.reduce((acc,record)=>{
        const materia=record.materia||'Geral',assunto=record.assunto||'Geral',topico=record.topico||'Geral';
        acc[materia]??={};acc[materia][assunto]??={};acc[materia][assunto][topico]??=[];acc[materia][assunto][topico].push(record);
        return acc;
      },{});
    }
    function countNested(assuntos){return Object.values(assuntos).flatMap(topicos=>Object.values(topicos).flat()).length}
    function fileCard(record){return`
      <div class="file-card">
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <p class="font-black truncate" style="font-family:'Sora',sans-serif;color:#e4dff0;">${escapeHtml(record.name)}</p>
            <p class="text-xs mt-1" style="color:rgba(196,188,220,.5);">${EnemFlowPdfTools.relativeDate(record.createdAt)} - ${EnemFlowPdfTools.formatBytes(record.size)} - ${escapeHtml(record.tipo||'material')}</p>
          </div>
          <i data-feather="file-text" class="w-5 h-5 shrink-0" style="color:#a78bfa;"></i>
        </div>
        <div class="grid grid-cols-3 gap-2 mt-4">
          <button class="device-action" onclick="openDevicePdf('${record.id}')"><i data-feather="external-link" class="w-3.5 h-3.5"></i>Abrir</button>
          <button class="device-action" onclick="downloadDevicePdf('${record.id}')"><i data-feather="download" class="w-3.5 h-3.5"></i>Baixar</button>
          <button class="device-action" style="color:#fca5a5;border-color:rgba(248,113,113,.2);background:rgba(248,113,113,.07);" onclick="deleteDevicePdf('${record.id}')"><i data-feather="trash" class="w-3.5 h-3.5"></i>Excluir</button>
        </div>
      </div>`}
    function emptyState(text){return`<div class="device-card p-10 text-center" style="color:rgba(196,188,220,.58);">${text}</div>`}
    async function openDevicePdf(id){const record=await EnemFlowPdfTools.getPdfRecord(id);if(record?.blob)EnemFlowPdfTools.openBlob(record.blob)}
    async function downloadDevicePdf(id){const record=await EnemFlowPdfTools.getPdfRecord(id);if(record?.blob)EnemFlowPdfTools.downloadBlob(record.blob,record.name)}
    async function deleteDevicePdf(id){if(!confirm('Excluir este arquivo deste dispositivo?'))return;await EnemFlowPdfTools.deletePdfRecord(id);renderFiles()}
    function escapeHtml(value){return EnemFlowPdfTools.escapeHtml(value)}
    renderFiles();
  </script>
</body>
</html>
