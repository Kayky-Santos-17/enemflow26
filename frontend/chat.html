<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07060e">
  <title>EnemFlow AI - Tutor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/feather-icons"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','sans-serif'],sora:['Sora','sans-serif']}}}};</script>
  <style>
    body{font-family:'Inter',sans-serif}.chat-shell{background:var(--ef-bg-deep,#07060e)}.chat-sidebar{width:18rem;background:rgba(12,10,22,.9);border-right:1px solid rgba(255,255,255,.08);backdrop-filter:blur(24px)}.chat-btn{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;min-height:42px;border-radius:14px;font-weight:800;font-size:.82rem;border:1px solid rgba(124,92,252,.16);background:rgba(124,92,252,.06);color:#c4b5fd}.chat-btn.primary{background:linear-gradient(135deg,#7c5cfc,#ec4899);color:#fff;border:0}.message-user{background:#6366f1;color:white;border-radius:24px 24px 6px 24px}.message-ai{background:rgba(12,10,22,.86);border:1px solid rgba(255,255,255,.08);border-radius:6px 24px 24px 24px;color:#e4dff0}.history-link{display:block;padding:.7rem .8rem;border-radius:12px;color:rgba(228,223,240,.74);font-size:.86rem}.history-link:hover,.history-link.active{background:rgba(124,92,252,.1);color:#c4b5fd}.prose p{margin-bottom:.8em}.prose ul{list-style:disc;padding-left:1.25rem}.prose ol{list-style:decimal;padding-left:1.25rem}.typing-dot{width:7px;height:7px;border-radius:999px;background:#a78bfa;animation:typing 1.2s infinite ease-in-out}.typing-dot:nth-child(2){animation-delay:.15s}.typing-dot:nth-child(3){animation-delay:.3s}@keyframes typing{0%,80%,100%{opacity:.35;transform:scale(.75)}40%{opacity:1;transform:scale(1)}}@media(max-width:1023px){.chat-sidebar{display:none}.chat-main{padding-top:58px}}
  </style>
  <link rel="icon" type="image/png" href="favicon.png?v=2">
</head>
<body class="chat-shell flex h-screen overflow-hidden">
  <div class="lg:hidden fixed top-0 inset-x-0 z-40 px-4 py-3 flex items-center justify-between" style="background:rgba(7,6,14,.92);border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(18px);">
    <button onclick="window.location.href='dashboard.html'" class="p-2 rounded-xl bg-white/5"><i data-feather="arrow-left" class="w-5 h-5"></i></button>
    <strong class="text-gradient text-xl" style="font-family:'Sora',sans-serif;">Tutor IA</strong>
    <button onclick="openExamFromChat()" class="p-2 rounded-xl bg-white/5"><i data-feather="zap" class="w-5 h-5"></i></button>
  </div>

  <aside class="chat-sidebar hidden lg:flex flex-col h-full">
    <div class="p-5 border-b border-white/10 flex items-center gap-3">
      <button onclick="window.location.href='dashboard.html'" class="p-2 rounded-xl bg-white/5"><i data-feather="arrow-left" class="w-4 h-4"></i></button>
      <strong class="text-gradient text-2xl" style="font-family:'Sora',sans-serif;">Tutor IA</strong>
    </div>
    <div class="p-4 space-y-2">
      <button onclick="newChat()" class="chat-btn primary"><i data-feather="plus" class="w-4 h-4"></i>Nova conversa</button>
      <button onclick="openExamFromChat()" class="chat-btn"><i data-feather="zap" class="w-4 h-4"></i>Gerar simulado</button>
      <button onclick="generateCurrentChatPdf()" class="chat-btn"><i data-feather="file-text" class="w-4 h-4"></i>Salvar chat em PDF</button>
      <button onclick="window.location.href='device.html'" class="chat-btn"><i data-feather="folder" class="w-4 h-4"></i>Neste dispositivo</button>
      <button onclick="clearAllChats()" class="chat-btn" style="color:#fca5a5;border-color:rgba(248,113,113,.18);background:rgba(248,113,113,.06);"><i data-feather="trash-2" class="w-4 h-4"></i>Limpar historico</button>
    </div>
    <div id="historyList" class="flex-1 overflow-y-auto p-4 space-y-1"></div>
  </aside>

  <main class="chat-main flex-1 flex flex-col min-w-0">
    <div id="chatBox" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-5">
      <div id="welcomeMessage" class="h-full flex flex-col items-center justify-center text-center opacity-70">
        <div class="w-16 h-16 rounded-2xl flex items-center justify-center mb-5 border border-violet-500/20" style="background:rgba(15,12,30,.75);"><img src="favicon.svg" class="w-9 h-9" alt=""></div>
        <h1 class="text-2xl font-black text-gradient" style="font-family:'Sora',sans-serif;">Como posso ajudar?</h1>
        <p class="max-w-md mt-2 text-sm" style="color:rgba(196,188,220,.55);">Tire duvidas, aprofunde um assunto e gere simulados a partir da conversa.</p>
      </div>
    </div>
    <div class="border-t border-white/10 px-4 md:px-8 py-4">
      <div class="max-w-4xl mx-auto">
        <input type="file" id="fileUpload" class="hidden" accept=".pdf,.png,.jpg,.jpeg,.txt" onchange="handleFileUpload(event)">
        <form id="chatForm" class="flex items-end gap-2 bg-black/30 border border-white/10 rounded-2xl p-2 shadow-lg focus-within:ring-2 focus-within:ring-indigo-500/50">
          <button type="button" onclick="document.getElementById('fileUpload').click()" class="p-3 text-slate-400 hover:text-indigo-400 rounded-xl hover:bg-white/5"><i data-feather="paperclip" class="w-5 h-5"></i></button>
          <textarea id="msgInput" rows="1" class="flex-1 bg-transparent border-none outline-none resize-none max-h-32 py-3 px-2 text-white placeholder:text-slate-500" placeholder="Digite sua duvida ou cole um texto..."></textarea>
          <button type="submit" id="sendBtn" class="p-3 rounded-xl disabled:opacity-50" style="background:linear-gradient(135deg,#7c5cfc,#ec4899);"><i data-feather="send" class="w-5 h-5 text-white"></i></button>
        </form>
        <p class="text-center text-[10px] text-slate-600 mt-2">A IA pode cometer erros. Verifique informacoes importantes.</p>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script src="pdf-tools.js"></script>
  <script>
    feather.replace();if(!App.getToken())window.location.href='login.html';
    const urlParams=new URLSearchParams(window.location.search);let currentChatId=urlParams.get('id')||null;let lastMessages=[];const chatBox=document.getElementById('chatBox'),msgInput=document.getElementById('msgInput'),welcomeMessage=document.getElementById('welcomeMessage');
    msgInput.addEventListener('input',function(){this.style.height='auto';this.style.height=this.scrollHeight+'px';if(!this.value)this.style.height='auto'});msgInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('chatForm').dispatchEvent(new Event('submit'))}});
    function sanitizeRenderedHtml(html){const t=document.createElement('template');t.innerHTML=html;t.content.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach(el=>el.remove());t.content.querySelectorAll('*').forEach(el=>[...el.attributes].forEach(a=>{const v=String(a.value||'').toLowerCase();if(/^on/i.test(a.name)||a.name==='srcdoc'||v.startsWith('javascript:'))el.removeAttribute(a.name)}));return t.innerHTML}
    function appendMessage(role,content){welcomeMessage.style.display='none';lastMessages.push({role,content});const wrap=document.createElement('div');wrap.className=`flex w-full max-w-4xl mx-auto animate-fade-in ${role==='user'?'justify-end':'justify-start'}`;if(role==='user'){wrap.innerHTML=`<div class="message-user max-w-[85%] md:max-w-[70%] px-6 py-4 shadow-md"><p class="whitespace-pre-wrap">${escapeHtml(content)}</p></div>`}else{wrap.innerHTML=`<div class="message-ai prose prose-sm md:prose-base dark:prose-invert max-w-[95%] md:max-w-[82%] px-6 py-4 shadow-sm">${sanitizeRenderedHtml(marked.parse(content))}</div>`}chatBox.appendChild(wrap);chatBox.scrollTop=chatBox.scrollHeight;feather.replace()}
    function showTyping(){welcomeMessage.style.display='none';const div=document.createElement('div');div.id='typingIndicator';div.className='flex w-full justify-start max-w-4xl mx-auto';div.innerHTML='<div class="message-ai px-6 py-4 flex gap-1"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>';chatBox.appendChild(div);chatBox.scrollTop=chatBox.scrollHeight}function removeTyping(){document.getElementById('typingIndicator')?.remove()}
    document.getElementById('chatForm').addEventListener('submit',async e=>{e.preventDefault();const texto=msgInput.value.trim();if(!texto)return;msgInput.value='';msgInput.style.height='auto';document.getElementById('sendBtn').disabled=true;appendMessage('user',texto);showTyping();try{const payload={mensagem:texto};if(currentChatId)payload.chatId=currentChatId;const data=await App.api('/api/chat',{method:'POST',body:JSON.stringify(payload)});removeTyping();appendMessage('assistant',data.resposta);if(!currentChatId){currentChatId=data.chatId;window.history.replaceState({},'',`chat.html?id=${currentChatId}`);loadHistoryList()}}catch(err){removeTyping();App.showToast(err.message,true)}finally{document.getElementById('sendBtn').disabled=false;msgInput.focus()}});
    async function handleFileUpload(e){const file=e.target.files[0];if(!file)return;App.showToast(`Processando arquivo: ${file.name}...`);showTyping();const formData=new FormData();formData.append('file',file);formData.append('pergunta','Extraia os dados principais e me de uma analise para estudos do ENEM.');try{const data=await App.api('/upload/analyze',{method:'POST',body:formData});appendMessage('user',`[Arquivo anexado: ${file.name}]\\n\\nAnalise este conteudo.`);removeTyping();appendMessage('assistant',data.resposta);if(data.chatId){currentChatId=data.chatId;window.history.replaceState({},'',`chat.html?id=${currentChatId}`);loadHistoryList()}}catch(err){removeTyping();App.showToast(err.message,true)}e.target.value=''}
    function newChat(){currentChatId=null;lastMessages=[];chatBox.innerHTML='';chatBox.appendChild(welcomeMessage);welcomeMessage.style.display='flex';window.history.pushState({},'','chat.html')}async function loadHistoryList(){try{const list=document.getElementById('historyList');const chats=await App.api('/api/chat');const visible=(chats||[]).filter(c=>c.tipo==='chat');if(!visible.length){list.innerHTML='<p class="text-xs text-center mt-4" style="color:rgba(196,188,220,.45);">Nenhuma conversa recente.</p>';return}list.innerHTML=visible.map(c=>`<a class="history-link ${c._id===currentChatId?'active':''}" href="chat.html?id=${c._id}"><i data-feather="message-square" class="w-3.5 h-3.5 inline mr-2 opacity-60"></i>${escapeHtml(c.titulo)}</a>`).join('');feather.replace()}catch(err){}}
    async function loadCurrentChat(){if(!currentChatId)return;try{const data=await App.api(`/api/chat/${currentChatId}`);chatBox.innerHTML='';lastMessages=[];(data.mensagens||[]).forEach(m=>appendMessage(m.role,m.content))}catch(err){App.showToast('Erro ao carregar conversa.',true);newChat()}}
    async function clearAllChats(){if(!confirm('Deseja apagar todo o historico de conversas?'))return;try{await App.api('/api/chat',{method:'DELETE'});App.showToast('Historico limpo.');newChat();loadHistoryList()}catch(err){App.showToast(err.message,true)}}
    async function generateCurrentChatPdf(){try{const source=currentChatId?(await App.api(`/api/chat/${currentChatId}`)).mensagens:lastMessages;if(!source.length)return App.showToast('Nao ha conversa para salvar.',true);const sections=[{title:'Conversa com Tutor IA',content:source.map(m=>`${m.role==='user'?'Aluno':'Tutor'}: ${m.content}`).join('\\n\\n')}];const filename=EnemFlowPdfTools.sanitizeFileName('Tutor IA - EnemFlow.pdf');const html=EnemFlowPdfTools.buildPdfHtml({title:'Tutor IA',theme:'Conversa de estudo',materia:'Tutor IA',sections});const blob=await EnemFlowPdfTools.generatePdfBlob(html,filename);await EnemFlowPdfTools.savePdfRecord({id:crypto.randomUUID(),name:filename,materia:'Tutor IA',assunto:'Conversas',topico:'Chat',tipo:'tutor',createdAt:new Date().toISOString(),size:blob.size,blob});EnemFlowPdfTools.openBlob(blob);App.showToast('PDF salvo neste dispositivo.')}catch(err){App.showToast(err.message,true)}}
    async function openExamFromChat(){let seedText=msgInput.value.trim();try{if(currentChatId){const chat=await App.api(`/api/chat/${currentChatId}`);const lastUser=[...(chat.mensagens||[])].reverse().find(m=>m.role==='user');seedText=seedText||lastUser?.content||chat.titulo||''}}catch(err){}localStorage.setItem('enemflow_exam_prefill',JSON.stringify(inferExamContext(seedText)));window.location.href='exercises.html'}
    function inferExamContext(text){const clean=String(text||'').toLowerCase();const materiaMap=[['Matematica',['matematica','geometria','algebra','funcao','probabilidade']],['Fisica',['fisica','cinematica','forca','energia','termodinamica']],['Quimica',['quimica','estequiometria','atomistica','solucoes']],['Biologia',['biologia','ecologia','genetica','citologia']],['Historia',['historia','vargas','brasil colonia','republica']],['Geografia',['geografia','clima','urbanizacao','cartografia']],['Portugues',['portugues','gramatica','interpretacao']],['Redacao',['redacao','tese','argumento','intervencao']]];const found=materiaMap.find(([,terms])=>terms.some(term=>clean.includes(term)));const words=String(text||'').split(/\\s+/).filter(w=>w.length>3).slice(0,8).join(' ');return{materia:found?found[0]:'',assunto:words||'',topico:words||'',descricao:'Gerado a partir do contexto discutido no Tutor IA.',quantidade:10}}
    async function handleSimuladoReviewContext(){const params=new URLSearchParams(window.location.search);if(params.get('simuladoReview')!=='true')return;const raw=localStorage.getItem('enemflow_tutor_review_context');localStorage.removeItem('enemflow_tutor_review_context');window.history.replaceState({},'','chat.html');if(!raw)return App.showToast('Nao encontrei dados do simulado para corrigir.',true);const context=JSON.parse(raw),simulado=context.simulado||{},wrong=(simulado.questoes||[]).filter(q=>(context.wrongQuestionIds||[]).includes(q.id));const compact=wrong.map(q=>`Questao ${q.id}: correta ${q.respostaCorreta}, aluno ${context.answers?.[q.id]||'em branco'}\\n${q.pergunta||q.enunciado}\\nResolucao base: ${q.resolucao||''}`).join('\\n\\n');const prompt=`${context.prompt}\\n\\nResumo do simulado: ${simulado.materia} > ${simulado.assunto} > ${simulado.topico}\\n\\nQuestoes erradas e respostas do aluno:\\n${compact||'O aluno nao errou questoes. Reforce estrategias e revise pontos de atencao.'}`;appendMessage('user',prompt);showTyping();try{const data=await App.api('/api/chat',{method:'POST',body:JSON.stringify({mensagem:prompt})});removeTyping();appendMessage('assistant',data.resposta);if(data.chatId){currentChatId=data.chatId;window.history.replaceState({},'',`chat.html?id=${currentChatId}`);loadHistoryList()}}catch(err){removeTyping();App.showToast(err.message,true)}}
    function handlePdfContext(){const params=new URLSearchParams(window.location.search);if(params.get('pdfContext')!=='true')return;const pdfTitle=localStorage.getItem('pdfContextTitle')||'PDF',contentId=localStorage.getItem('pdfContextContentId')||'';localStorage.removeItem('pdfContextTitle');localStorage.removeItem('pdfContextContentId');localStorage.removeItem('pdfContextUrl');window.history.replaceState({},'','chat.html');if(!contentId)return App.showToast('Nao foi possivel identificar o PDF selecionado.',true);appendMessage('user',`Estou estudando o material: \"${pdfTitle}\". Analise o PDF e me ajude com duvidas sobre este conteudo.`);showTyping();App.api('/api/chat/content-context',{method:'POST',body:JSON.stringify({contentId,pergunta:`Analise o PDF \"${pdfTitle}\" e explique os pontos principais em formato claro para estudo do ENEM.`})}).then(data=>{removeTyping();appendMessage('assistant',data.resposta);if(data.chatId){currentChatId=data.chatId;window.history.replaceState({},'',`chat.html?id=${currentChatId}`);loadHistoryList()}}).catch(err=>{removeTyping();App.showToast(err.message,true)})}
    function escapeHtml(v){return String(v||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
    loadHistoryList();if(currentChatId)loadCurrentChat();handleSimuladoReviewContext();handlePdfContext();
  </script>
</body>
</html>
