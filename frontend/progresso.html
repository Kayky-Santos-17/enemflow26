<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EnemFlow - Progresso</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="sidebar.js" defer></script>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="favicon.png?v=2">
</head>
<body class="ef-deep-bg" style="font-family:'Inter',sans-serif;">
  <div class="page-enter"></div>
  
  <div class="app-container">
    
    <!-- Barra de Topo Mobile -->
    <div class="mobile-top-actions" style="display: none;">
      <div class="sidebar-logo" style="margin: 0; padding: 0;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#gradMobile)" stroke-width="2">
          <defs>
            <linearGradient id="gradMobile" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
            </linearGradient>
          </defs>
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
      </div>
      <div style="display: flex; gap: 10px;">
        <div id="adminMobileBtn"></div>
        <button onclick="App.logout()" class="btn btn-danger" style="padding: 8px; border-radius: 10px;">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </button>
      </div>
    </div>
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="url(#grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
            </linearGradient>
          </defs>
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
        <span class="text-gradient" style="font-family: 'Outfit'; font-weight: 800;">EnemFlow</span>
      </div>

      <nav style="flex: 1;">
        <a href="dashboard.html" class="nav-link">
          <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          Home
        </a>
        <a href="progresso.html" class="nav-link active">
          <svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
          Progresso
        </a>
        <a href="anotacoes.html" class="nav-link">
          <svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
          Anotações
        </a>
        <a href="perfil.html" class="nav-link">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          Meu Perfil
        </a>
      </nav>

      <button onclick="App.logout()" class="btn btn-danger" style="margin-top: auto; justify-content: flex-start; padding-left: 16px;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Sair da conta
      </button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      
      <header class="topbar flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div class="user-profile" style="cursor: pointer;" onclick="window.location.href='perfil.html'">
          <div class="avatar" id="avatarLetter" style="background-size: cover; background-position: center;">?</div>
          <div>
            <h2 id="userName" style="font-size: 1.4rem; line-height: 1.2;">Carregando...</h2>
            <p class="text-muted">Acompanhe sua evolução constante.</p>
          </div>
        </div>
        
        <div class="xp-badge" style="font-size: 1rem; padding: 8px 16px;">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" stroke="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
          <span id="userXP">0</span> XP Acumulado
        </div>
      </header>

      <section>
        <div class="card">
          <h3 style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem;">Matérias Estudadas</h3>
          
          <div id="progresso-list" style="display: flex; flex-direction: column; gap: 1rem;">
            <!-- Preenchido via JS -->
            <p class="text-muted">Carregando seus dados vitais...</p>
          </div>
        </div>
      </section>

    </main>
  </div>

  <script src="app.js"></script>
  <script>
    if(!App.getToken()) window.location.href = 'login.html';

    async function loadProgress() {
      try {
        const user = await App.api('/auth/me');
        document.getElementById('userName').innerText = user.nome;
        const avatarDiv = document.getElementById('avatarLetter');
        if (user.avatarUrl) {
          avatarDiv.style.backgroundImage = `url(${user.avatarUrl})`;
          avatarDiv.innerText = '';
        } else {
          avatarDiv.innerText = user.nome.charAt(0).toUpperCase();
        }
        document.getElementById('userXP').innerText = user.xp;
        
        
        const listContainer = document.getElementById('progresso-list');
        
        if(!user.progresso || user.progresso.length === 0) {
          listContainer.innerHTML = `
            <div style="text-align: center; padding: 3rem 1rem;">
              <div style="width: 80px; height: 80px; background: rgba(99, 102, 241, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
                <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 20v-6M6 20V10M18 20V4"></path>
                </svg>
              </div>
              <h3 style="font-size: 1.25rem; font-weight: 700; color: #e4dff0; margin-bottom: 0.5rem; font-family: 'Sora', sans-serif;">Nenhum Progresso Registrado</h3>
              <p style="color: rgba(196, 188, 220, 0.6); max-width: 400px; margin: 0 auto 2rem; font-size: 0.9rem;">Você ainda não completou nenhuma sessão de estudos em nossa plataforma. Volte para a Home, escolha um material e inicie o Modo Foco!</p>
              <button onclick="window.location.href='dashboard.html'" class="btn btn-primary" style="padding: 12px 24px; border-radius: 12px; font-weight: bold; background: linear-gradient(135deg, #6366f1, #ec4899); color: white; border: none; cursor: pointer; transition: all 0.2s;">Ir para o Dashboard</button>
            </div>
          `;
          return;
        }

        // Agrupar por Matéria
        const grouped = user.progresso.reduce((acc, p) => {
          const materia = p.contentId ? p.contentId.materia : 'Diversos';
          if (!acc[materia]) acc[materia] = { items: [], totalMin: 0 };
          const min = Math.floor(p.tempoEstudado / 60);
          acc[materia].items.push(p);
          acc[materia].totalMin += min;
          return acc;
        }, {});

        listContainer.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6";
        listContainer.style.display = "grid"; // Override any old flex rules

        listContainer.innerHTML = Object.entries(grouped).map(([materia, data]) => `
          <div class="group relative flex flex-col justify-between overflow-hidden p-6 rounded-3xl border transition-all duration-500 hover:-translate-y-2" style="background: rgba(10, 8, 20, 0.7); backdrop-filter: blur(24px); border-color: rgba(255,255,255,0.05); box-shadow: 0 10px 40px -10px rgba(0,0,0,0.5);">
            <!-- Colored Glowing Orb in background -->
            <div class="absolute -right-8 -top-8 w-32 h-32 rounded-full opacity-10 group-hover:opacity-40 group-hover:scale-[1.5] transition-all duration-700 blur-[30px]" style="background: linear-gradient(135deg, #7c5cfc, #ec4899);"></div>
            
            <div class="relative z-10 flex justify-between items-start mb-6">
              <h3 class="text-2xl font-extrabold tracking-tight text-white" style="font-family:'Sora',sans-serif; text-shadow: 0 4px 20px rgba(0,0,0,0.5);">
                ${materia}
              </h3>
              
              <!-- Círculo de Total -->
              <div class="flex flex-col items-center justify-center shrink-0 w-16 h-16 rounded-full border-2 border-emerald-500/50 bg-emerald-500/10 shadow-[0_0_15px_rgba(16,185,129,0.2)] group-hover:scale-105 transition-transform">
                  <span class="text-xl font-black text-emerald-400 leading-none">${data.totalMin}</span>
                  <span class="text-[8px] font-bold text-emerald-500 uppercase mt-0.5 tracking-wider">min total</span>
              </div>
            </div>
            
            <div class="relative z-10 flex flex-col gap-2 max-h-[180px] overflow-y-auto pr-2" style="scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent;">
              ${data.items.map(p => {
                const minutos = Math.floor(p.tempoEstudado / 60);
                const titulo = p.contentId ? p.contentId.titulo : 'Conteúdo Excluído';
                return `
                  <div class="flex justify-between items-center p-3 rounded-2xl border transition-all duration-300 hover:bg-white/5" style="background: rgba(255,255,255,0.02); border-color: rgba(255,255,255,0.03);">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="w-2 h-2 shrink-0 rounded-full bg-violet-500 shadow-[0_0_8px_rgba(139,92,252,0.6)]"></div>
                        <span class="font-medium text-sm text-slate-300 truncate">${titulo}</span>
                    </div>
                    <div class="flex flex-col items-center justify-center shrink-0 w-10 h-10 ml-2 rounded-full border border-emerald-500/30 bg-emerald-500/5">
                        <span class="text-[13px] font-bold text-emerald-400 leading-none">${minutos}</span>
                        <span class="text-[6px] font-bold text-emerald-500 uppercase tracking-widest mt-0.5">min</span>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `).join('');

      } catch (err) {
        if(err.message.includes('Sessão') || err.message.includes('Token') || err.message.includes('Usuário')) App.logout();
        else App.showToast('Conectando ao servidor...', true);
      }
    }

    loadProgress();
  </script>
</body>
</html>
