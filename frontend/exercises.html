<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EnemFlow AI - Questões ENEM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/feather-icons"></script>
  <script src="sidebar.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
  <link rel="icon" type="image/png" href="favicon.png?v=2">
</head>
<body class="flex h-screen overflow-hidden ef-deep-bg" style="font-family:'Inter',sans-serif;">

  <!-- Mobile Header -->
  <div class="lg:hidden fixed top-0 w-full glass z-40 px-4 py-3 flex items-center justify-between border-b">
    <button onclick="window.location.href='dashboard.html'" class="p-2 bg-slate-100 dark:bg-white/5 rounded-lg">
      <i data-feather="arrow-left" class="w-5 h-5"></i>
    </button>
    <div class="flex items-center gap-2">
      <i data-feather="edit-3" class="text-indigo-500 w-5 h-5"></i>
      <span class="font-bold">Gerador de <span class="text-gradient">Questões</span></span>
    </div>
    <div class="w-9"></div>
  </div>

  <!-- Sidebar Omitida -->


  <main class="flex-1 overflow-y-auto relative pt-16 lg:pt-8 pb-20 lg:pl-8">
    <div class="bg-glow top-[10%] right-[10%]"></div>
    
    <div class="max-w-4xl mx-auto p-4 md:p-6">
      
      <div class="text-center mb-10 animate-fade-in">
        <div class="w-16 h-16 rounded-2xl bg-purple-500/10 flex items-center justify-center mx-auto mb-4 border border-purple-500/20 shadow-[0_0_30px_rgba(168,85,247,0.2)]">
          <i data-feather="edit-3" class="w-8 h-8 text-purple-500"></i>
        </div>
        <h1 class="text-3xl font-bold mb-2" style="font-family:'Sora',sans-serif;"><span class="text-gradient">Simulado Inteligente</span></h1>
        <p style="color:rgba(196,188,220,0.5);">Gere questões no estilo ENEM focadas nas suas dificuldades.</p>
      </div>

      <!-- Formulário de Geração -->
      <div class="glass-card p-6 md:p-8 mb-8 animate-fade-in" style="animation-delay: 0.1s;">
        <form id="exerciseForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label class="text-sm font-medium text-slate-700 dark:text-slate-300">Disciplina do ENEM</label>
            <select id="materia" required class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-white/10 outline-none focus:ring-2 focus:ring-purple-500">
              <option value="">Selecione a matéria...</option>
              <option value="Matemática">Matemática</option>
              <option value="Física">Física</option>
              <option value="Química">Química</option>
              <option value="Biologia">Biologia</option>
              <option value="História">História</option>
              <option value="Geografia">Geografia</option>
              <option value="Filosofia">Filosofia</option>
              <option value="Sociologia">Sociologia</option>
              <option value="Literatura">Literatura</option>
              <option value="Português">Português</option>
              <option value="Redação">Redação</option>
              <option value="Artes">Artes</option>
              <option value="Inglês">Inglês</option>
              <option value="Espanhol">Espanhol</option>
            </select>
          </div>
          <div class="space-y-2">
            <label class="text-sm font-medium text-slate-700 dark:text-slate-300">Assunto Específico (Opcional)</label>
            <input type="text" id="assunto" class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-white/10 outline-none focus:ring-2 focus:ring-purple-500" placeholder="Ex: Termodinâmica, Era Vargas, Função do 1º Grau">
          </div>
          <div class="md:col-span-2">
            <button type="submit" id="genBtn" class="w-full py-4 bg-gradient-to-r from-purple-500 to-indigo-500 hover:opacity-90 text-white rounded-xl font-semibold shadow-lg shadow-purple-500/30 transition-all flex justify-center items-center gap-2">
              <i data-feather="zap" class="w-5 h-5"></i> Gerar Questão Inédita
            </button>
          </div>
        </form>
      </div>

      <!-- Container do Resultado (Escondido inicialmente) -->
      <div id="resultContainer" class="hidden">
        <div class="flex items-center justify-between mb-4 border-b border-slate-200 dark:border-white/10 pb-2">
          <h2 class="text-lg font-bold flex items-center gap-2">
            <i data-feather="book-open" class="text-purple-500 w-5 h-5"></i> Sua Questão
          </h2>
          <div class="flex items-center gap-2 text-pink-500 bg-pink-500/10 px-3 py-1 rounded-full border border-pink-500/20">
            <i data-feather="clock" class="w-4 h-4"></i>
            <span id="timerDisplay" class="font-mono font-bold">00:00</span>
          </div>
        </div>
        
        <div class="glass border-l-4 border-l-purple-500 rounded-r-2xl p-6 md:p-8 relative">
          <!-- Renderização do Enunciado -->
          <div id="exerciseContent" class="prose prose-slate dark:prose-invert max-w-none prose-p:leading-relaxed prose-headings:text-purple-500 mb-6"></div>
          
          <!-- Alternativas Interativas Geradas Dinamicamente -->
          <div id="interactiveOptions" class="flex flex-col gap-3 mb-8"></div>
          
          <!-- Feedback e Botões -->
          <div id="feedbackContainer" class="hidden mb-6 p-4 rounded-xl"></div>
          
          <div class="flex justify-between items-center mt-8">
            <button id="submitAnswerBtn" onclick="submitAnswer()" class="hidden px-6 py-3 bg-gradient-to-r from-pink-500 to-purple-500 hover:opacity-90 text-white rounded-xl font-bold shadow-lg shadow-pink-500/30 transition-all flex items-center gap-2">
              <i data-feather="check-circle" class="w-5 h-5"></i> Confirmar Resposta
            </button>
            <button onclick="clearExercise()" class="ml-auto px-4 py-2 bg-slate-100 dark:bg-white/5 hover:bg-slate-200 dark:hover:bg-white/10 rounded-lg text-sm font-medium transition-colors">
              Ocultar e Tentar Outra
            </button>
          </div>
        </div>
      </div>

    </div>

    <!-- Novo Espaço: PDFs e Conteúdos Recomendados (Requisito 3) -->
    <div class="max-w-4xl mx-auto p-4 md:p-6 mt-8 animate-fade-in" style="animation-delay: 0.2s;">
      <div class="glass-card p-6 md:p-8">
        <h2 class="text-xl font-bold font-outfit mb-6 flex items-center justify-between border-b border-slate-200 dark:border-white/10 pb-4">
          <span class="flex items-center gap-2">
            <i data-feather="book-open" class="text-indigo-500 w-5 h-5"></i> Biblioteca de Materiais Disponíveis (PDFs)
          </span>
          <a href="materias.html" class="text-xs font-semibold text-indigo-500 hover:text-indigo-400 flex items-center gap-1">
            Ver todas as matérias <i data-feather="chevron-right" class="w-4 h-4"></i>
          </a>
        </h2>
        <div id="materials-list-exercises" class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="text-center py-6 text-slate-500 col-span-full">
            <i data-feather="loader" class="w-6 h-6 animate-spin mx-auto mb-2 text-indigo-500"></i>
            Carregando materiais...
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    feather.replace();
    if(!App.getToken()) window.location.href = 'login.html';

    async function loadFeaturedMaterials() {
      try {
        const contents = await App.api('/contents');
        const container = document.getElementById('materials-list-exercises');
        if (!contents || contents.length === 0) {
          container.innerHTML = `
            <div class="text-center py-6 text-slate-400 col-span-full">
              Nenhum material cadastrado ainda. Peça a um administrador para cadastrar PDFs ou vídeos!
            </div>
          `;
          return;
        }

        // Exibe os materiais ativos cadastrados pelo Admin
        container.innerHTML = contents.map(t => {
          const isPdf = t.url && t.url.startsWith('data:application/pdf') || (t.url && t.url.toLowerCase().endsWith('.pdf'));
          const isVideo = t.url && (t.url.includes('youtube.com') || t.url.includes('youtu.be') || t.url.toLowerCase().endsWith('.mp4'));
          
          let badgeType = 'Artigo';
          let badgeColor = 'bg-blue-500/10 text-blue-500 border border-blue-500/20';
          if (isPdf) {
            badgeType = 'PDF de Estudo';
            badgeColor = 'bg-red-500/10 text-red-500 border border-red-500/20';
          } else if (isVideo) {
            badgeType = 'Vídeo Aula';
            badgeColor = 'bg-amber-500/10 text-amber-500 border border-amber-500/20';
          }

          let actionBtn = '';
          if (isPdf) {
            actionBtn = `
              <button onclick="startStudy('${t._id}')" class="px-4 py-2 bg-gradient-to-r from-red-500 to-pink-500 text-white font-bold rounded-xl text-xs hover:opacity-90 transition-all flex items-center gap-1 shadow-md shadow-red-500/20">
                <i data-feather="file-text" class="w-3.5 h-3.5"></i> Estudar PDF
              </button>
            `;
          } else if (isVideo) {
            actionBtn = `
              <button onclick="startStudy('${t._id}')" class="px-4 py-2 bg-gradient-to-r from-amber-500 to-orange-500 text-white font-bold rounded-xl text-xs hover:opacity-90 transition-all flex items-center gap-1 shadow-md shadow-amber-500/20">
                <i data-feather="play" class="w-3.5 h-3.5"></i> Assistir Aula
              </button>
            `;
          } else {
            actionBtn = `
              <button onclick="startStudy('${t._id}')" class="px-4 py-2 bg-gradient-to-r from-indigo-500 to-pink-500 text-white font-bold rounded-xl text-xs hover:opacity-90 transition-all flex items-center gap-1 shadow-md shadow-indigo-500/20">
                <i data-feather="external-link" class="w-3.5 h-3.5"></i> Abrir Conteúdo
              </button>
            `;
          }

          return `
            <div class="glass p-5 rounded-2xl flex flex-col justify-between border border-slate-200 dark:border-white/5 gap-3 hover:-translate-y-0.5 transition-transform duration-200">
              <div>
                <div class="flex items-center justify-between mb-2">
                  <span class="px-2 py-0.5 rounded-full font-bold text-[9px] uppercase tracking-wider ${badgeColor}">${badgeType}</span>
                  <span class="text-xs text-indigo-500 font-semibold">${t.materia}</span>
                </div>
                <h3 class="text-sm font-bold font-outfit text-slate-800 dark:text-slate-100 line-clamp-1">${t.titulo}</h3>
                ${t.assunto ? `<p class="text-xs text-slate-500 dark:text-slate-400 mt-1 line-clamp-1">${t.assunto}</p>` : ''}
              </div>
              <div class="flex items-center justify-between mt-1 border-t border-slate-100 dark:border-white/5 pt-2">
                <span class="text-[10px] text-slate-400 font-semibold truncate max-w-[120px]">${t.subassunto || ''}</span>
                ${actionBtn}
              </div>
            </div>
          `;
        }).join('');
        feather.replace();
      } catch (err) {
        console.error('Falha ao carregar materiais na página de questões:', err);
      }
    }

    function startStudy(contentId) {
      localStorage.setItem('currentContentId', contentId);
      window.location.href = 'study.html';
    }

    loadFeaturedMaterials();

    // --- State Persistence: Restore saved inputs ---
    const savedMateria = localStorage.getItem('exercise_materia');
    const savedAssunto = localStorage.getItem('exercise_assunto');
    if (savedMateria) document.getElementById('materia').value = savedMateria;
    if (savedAssunto) document.getElementById('assunto').value = savedAssunto;

    // Save inputs when user changes them
    document.getElementById('materia').addEventListener('change', (e) => {
      localStorage.setItem('exercise_materia', e.target.value);
    });
    document.getElementById('assunto').addEventListener('input', (e) => {
      localStorage.setItem('exercise_assunto', e.target.value);
    });

    // Restore previously generated question
    const exerciseVisible = localStorage.getItem('exercise_visible') === 'true';
    const savedExerciseContent = localStorage.getItem('exercise_content');
    if (exerciseVisible && savedExerciseContent) {
      const resultContainer = document.getElementById('resultContainer');
      const contentDiv = document.getElementById('exerciseContent');
      contentDiv.innerHTML = savedExerciseContent;
      resultContainer.classList.remove('hidden');
    }

    let timerInterval = null;
    let elapsedSeconds = 0;
    let currentSkillId = 'M1'; // Default, idealmente extraído da IA
    let isAnswered = false;

    function startTimer() {
      clearInterval(timerInterval);
      elapsedSeconds = 0;
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        elapsedSeconds++;
        updateTimerDisplay();
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
    }

    function updateTimerDisplay() {
      const m = Math.floor(elapsedSeconds / 60).toString().padStart(2, '0');
      const s = (elapsedSeconds % 60).toString().padStart(2, '0');
      document.getElementById('timerDisplay').textContent = `${m}:${s}`;
    }

    function parseMarkdownToInteractive(markdown) {
      // Basic parser to extract alternatives (a), b), c), etc.) from markdown
      const lines = markdown.split('\n');
      const enunciado = [];
      const alternativas = [];
      const altRegex = /^([a-eA-E])[\)\.]\s*(.*)/;
      
      let inAlts = false;
      lines.forEach(line => {
        const match = line.match(altRegex);
        if (match) {
          inAlts = true;
          alternativas.push({ letter: match[1].toUpperCase(), text: match[2] });
        } else if (!inAlts && !line.toLowerCase().includes('resposta corret')) {
          enunciado.push(line);
        }
      });

      const contentDiv = document.getElementById('exerciseContent');
      contentDiv.innerHTML = marked.parse(enunciado.join('\n'));

      const optionsDiv = document.getElementById('interactiveOptions');
      optionsDiv.innerHTML = '';
      
      if (alternativas.length > 0) {
        alternativas.forEach(alt => {
          const optId = `opt_${alt.letter}`;
          optionsDiv.innerHTML += `
            <label class="flex items-center gap-3 p-4 rounded-xl border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-black/20 cursor-pointer hover:bg-purple-50 dark:hover:bg-purple-500/10 hover:border-purple-300 dark:hover:border-purple-500/30 transition-all group">
              <div class="relative flex items-center justify-center w-6 h-6 rounded-full border-2 border-slate-300 dark:border-slate-500 group-hover:border-purple-500">
                <input type="radio" name="enemOption" value="${alt.letter}" class="peer sr-only" onchange="enableSubmit()">
                <div class="w-3 h-3 rounded-full bg-purple-500 scale-0 peer-checked:scale-100 transition-transform"></div>
              </div>
              <span class="font-bold text-purple-600 dark:text-purple-400">${alt.letter})</span>
              <span class="text-slate-700 dark:text-slate-300 flex-1">${alt.text}</span>
            </label>
          `;
        });
        document.getElementById('submitAnswerBtn').classList.remove('hidden');
      } else {
        // Se não conseguiu parsear alternativas, renderiza normal
        contentDiv.innerHTML = marked.parse(markdown);
      }
    }

    function enableSubmit() {
      if (!isAnswered) {
        document.getElementById('submitAnswerBtn').classList.remove('opacity-50', 'cursor-not-allowed');
      }
    }

    async function submitAnswer() {
      if (isAnswered) return;
      const selected = document.querySelector('input[name="enemOption"]:checked');
      if (!selected) {
        App.showToast('Selecione uma alternativa!', true);
        return;
      }
      
      stopTimer();
      isAnswered = true;
      const btn = document.getElementById('submitAnswerBtn');
      btn.innerHTML = '<i data-feather="loader" class="w-5 h-5 animate-spin"></i> Analisando...';
      
      try {
        // Lógica simulada de correção (na prática o backend quem deveria validar a resposta correta)
        // Aqui assumiremos que a letra A é correta no mock, ou podemos randomizar o acerto para homologação
        const correto = Math.random() > 0.3; // 70% de chance de acerto para testar a evolução

        // Mapear materia para skill (Simulando)
        const materiaStr = document.getElementById('materia').value;
        currentSkillId = materiaStr === 'Matemática' ? 'M1' : 'N1';

        const res = await App.api('/api/ai-adaptation/solve', {
          method: 'POST',
          body: JSON.stringify({
            skillId: currentSkillId,
            area: materiaStr || 'Matemática',
            correto,
            tempoEmSegundos: elapsedSeconds
          })
        });

        const fb = document.getElementById('feedbackContainer');
        fb.classList.remove('hidden');
        if (correto) {
          fb.className = 'mb-6 p-4 rounded-xl bg-green-500/10 border border-green-500/20 text-green-400';
          fb.innerHTML = `<h3 class="font-bold flex items-center gap-2"><i data-feather="check-circle"></i> Resposta Correta!</h3><p class="text-sm mt-1">Você ganhou +${res.reward} pontos de aprendizado Q-Learning!</p>`;
        } else {
          fb.className = 'mb-6 p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400';
          fb.innerHTML = `<h3 class="font-bold flex items-center gap-2"><i data-feather="x-circle"></i> Resposta Incorreta</h3><p class="text-sm mt-1">Sua proficiência sofreu uma leve penalidade. Continue tentando!</p>`;
        }
        
        btn.classList.add('hidden');
        App.showToast('Nível de proficiência atualizado no Mapa de Habilidades!');
        feather.replace();

      } catch (err) {
        App.showToast('Erro ao validar resposta.', true);
        btn.innerHTML = 'Confirmar Resposta';
        isAnswered = false;
      }
    }

    // Clear saved exercise state and hide result
    function clearExercise() {
      stopTimer();
      localStorage.removeItem('exercise_content');
      localStorage.removeItem('exercise_visible');
      document.getElementById('resultContainer').classList.add('hidden');
      document.getElementById('feedbackContainer').classList.add('hidden');
      document.getElementById('submitAnswerBtn').classList.add('hidden');
      document.getElementById('interactiveOptions').innerHTML = '';
      isAnswered = false;
      document.getElementById('genBtn').focus();
    }

    document.getElementById('exerciseForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const materia = document.getElementById('materia').value;
      const assunto = document.getElementById('assunto').value;
      const btn = document.getElementById('genBtn');
      const resultContainer = document.getElementById('resultContainer');
      const contentDiv = document.getElementById('exerciseContent');

      btn.disabled = true;
      btn.innerHTML = '<i data-feather="loader" class="w-5 h-5 animate-spin"></i> Elaborando questão...';
      feather.replace();

      try {
        const data = await App.api('/api/chat/exercise', {
          method: 'POST',
          body: JSON.stringify({ materia, assunto })
        });

        clearExercise(); // limpa estado anterior
        parseMarkdownToInteractive(data.resposta);
        
        resultContainer.classList.remove('hidden');
        resultContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });

        // Save generated exercise state
        localStorage.setItem('exercise_content', data.resposta);
        localStorage.setItem('exercise_visible', 'true');

        startTimer();
        App.showToast('Questão gerada com sucesso!');
        feather.replace();
      } catch (err) {
        App.showToast(err.message, true);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i data-feather="zap" class="w-5 h-5"></i> Gerar Questão Inédita';
        feather.replace();
      }
    });
  </script>
</body>
</html>
