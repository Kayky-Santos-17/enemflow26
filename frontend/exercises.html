<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EnemFlow AI - Questões ENEM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/feather-icons"></script>
  <script src="sidebar.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
</head>
<body class="flex h-screen overflow-hidden ef-deep-bg" style="font-family:'Inter',sans-serif;">

  <!-- Mobile Header -->
  <div class="lg:hidden fixed top-0 w-full glass z-40 px-4 py-3 flex items-center justify-between border-b">
    <button onclick="window.location.href='dashboard.html'" class="p-2 bg-slate-100 dark:bg-white/5 rounded-lg">
      <i data-feather="arrow-left" class="w-5 h-5"></i>
    </button>
    <div class="flex items-center gap-2">
      <i data-feather="edit-3" class="text-indigo-500 w-5 h-5"></i>
      <span class="font-bold">Gerador de <span class="text-gradient">Questões</span></span>
    </div>
    <div class="w-9"></div>
  </div>

  <!-- Sidebar Omitida -->


  <main class="flex-1 overflow-y-auto relative pt-16 lg:pt-8 pb-20 lg:pl-8">
    <div class="bg-glow top-[10%] right-[10%]"></div>
    
    <div class="max-w-4xl mx-auto p-4 md:p-6">
      
      <div class="text-center mb-10 animate-fade-in">
        <div class="w-16 h-16 rounded-2xl bg-purple-500/10 flex items-center justify-center mx-auto mb-4 border border-purple-500/20 shadow-[0_0_30px_rgba(168,85,247,0.2)]">
          <i data-feather="edit-3" class="w-8 h-8 text-purple-500"></i>
        </div>
        <h1 class="text-3xl font-bold mb-2" style="font-family:'Sora',sans-serif;"><span class="text-gradient">Simulado Inteligente</span></h1>
        <p style="color:rgba(196,188,220,0.5);">Gere questões no estilo ENEM focadas nas suas dificuldades.</p>
      </div>

      <!-- Formulário de Geração -->
      <div class="glass-card p-6 md:p-8 mb-8 animate-fade-in" style="animation-delay: 0.1s;">
        <form id="exerciseForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label class="text-sm font-medium text-slate-700 dark:text-slate-300">Disciplina do ENEM</label>
            <select id="materia" required class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-white/10 outline-none focus:ring-2 focus:ring-purple-500">
              <option value="">Selecione a matéria...</option>
              <option value="Matemática">Matemática</option>
              <option value="Física">Física</option>
              <option value="Química">Química</option>
              <option value="Biologia">Biologia</option>
              <option value="História">História</option>
              <option value="Geografia">Geografia</option>
              <option value="Filosofia">Filosofia</option>
              <option value="Sociologia">Sociologia</option>
              <option value="Literatura">Literatura</option>
              <option value="Português">Português</option>
              <option value="Redação">Redação</option>
              <option value="Artes">Artes</option>
              <option value="Inglês">Inglês</option>
              <option value="Espanhol">Espanhol</option>
            </select>
          </div>
          <div class="space-y-2">
            <label class="text-sm font-medium text-slate-700 dark:text-slate-300">Assunto Específico (Opcional)</label>
            <input type="text" id="assunto" class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-white/10 outline-none focus:ring-2 focus:ring-purple-500" placeholder="Ex: Termodinâmica, Era Vargas, Função do 1º Grau">
          </div>
          <div class="md:col-span-2">
            <button type="submit" id="genBtn" class="w-full py-4 bg-gradient-to-r from-purple-500 to-indigo-500 hover:opacity-90 text-white rounded-xl font-semibold shadow-lg shadow-purple-500/30 transition-all flex justify-center items-center gap-2">
              <i data-feather="zap" class="w-5 h-5"></i> Gerar Questão Inédita
            </button>
          </div>
        </form>
      </div>

      <!-- Container do Resultado (Escondido inicialmente) -->
      <div id="resultContainer" class="hidden">
        <h2 class="text-lg font-bold mb-4 flex items-center gap-2 border-b border-slate-200 dark:border-white/10 pb-2">
          <i data-feather="book-open" class="text-purple-500 w-5 h-5"></i> Sua Questão
        </h2>
        
        <div class="glass border-l-4 border-l-purple-500 rounded-r-2xl p-6 md:p-8 relative">
          <!-- Renderização do Markdown -->
          <div id="exerciseContent" class="prose prose-slate dark:prose-invert max-w-none prose-p:leading-relaxed prose-headings:text-purple-500"></div>
          
          <div class="mt-8 flex justify-end">
             <button onclick="document.getElementById('resultContainer').classList.add('hidden'); document.getElementById('genBtn').focus();" class="px-4 py-2 bg-slate-100 dark:bg-white/5 hover:bg-slate-200 dark:hover:bg-white/10 rounded-lg text-sm font-medium transition-colors">
               Ocultar e Tentar Outra
             </button>
          </div>
        </div>
      </div>

    </div>

    <!-- Novo Espaço: PDFs e Conteúdos Recomendados (Requisito 3) -->
    <div class="max-w-4xl mx-auto p-4 md:p-6 mt-8 animate-fade-in" style="animation-delay: 0.2s;">
      <div class="glass-card p-6 md:p-8">
        <h2 class="text-xl font-bold font-outfit mb-6 flex items-center justify-between border-b border-slate-200 dark:border-white/10 pb-4">
          <span class="flex items-center gap-2">
            <i data-feather="book-open" class="text-indigo-500 w-5 h-5"></i> Biblioteca de Materiais Disponíveis (PDFs)
          </span>
          <a href="materias.html" class="text-xs font-semibold text-indigo-500 hover:text-indigo-400 flex items-center gap-1">
            Ver todas as matérias <i data-feather="chevron-right" class="w-4 h-4"></i>
          </a>
        </h2>
        <div id="materials-list-exercises" class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="text-center py-6 text-slate-500 col-span-full">
            <i data-feather="loader" class="w-6 h-6 animate-spin mx-auto mb-2 text-indigo-500"></i>
            Carregando materiais...
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    feather.replace();
    if(!App.getToken()) window.location.href = 'login.html';

    async function loadFeaturedMaterials() {
      try {
        const contents = await App.api('/contents');
        const container = document.getElementById('materials-list-exercises');
        if (!contents || contents.length === 0) {
          container.innerHTML = `
            <div class="text-center py-6 text-slate-400 col-span-full">
              Nenhum material cadastrado ainda. Peça a um administrador para cadastrar PDFs ou vídeos!
            </div>
          `;
          return;
        }

        // Exibe os materiais ativos cadastrados pelo Admin
        container.innerHTML = contents.map(t => {
          const isPdf = t.url && t.url.startsWith('data:application/pdf') || (t.url && t.url.toLowerCase().endsWith('.pdf'));
          const isVideo = t.url && (t.url.includes('youtube.com') || t.url.includes('youtu.be') || t.url.toLowerCase().endsWith('.mp4'));
          
          let badgeType = 'Artigo';
          let badgeColor = 'bg-blue-500/10 text-blue-500 border border-blue-500/20';
          if (isPdf) {
            badgeType = 'PDF de Estudo';
            badgeColor = 'bg-red-500/10 text-red-500 border border-red-500/20';
          } else if (isVideo) {
            badgeType = 'Vídeo Aula';
            badgeColor = 'bg-amber-500/10 text-amber-500 border border-amber-500/20';
          }

          let actionBtn = '';
          if (isPdf) {
            actionBtn = `
              <button onclick="startStudy('${t._id}')" class="px-4 py-2 bg-gradient-to-r from-red-500 to-pink-500 text-white font-bold rounded-xl text-xs hover:opacity-90 transition-all flex items-center gap-1 shadow-md shadow-red-500/20">
                <i data-feather="file-text" class="w-3.5 h-3.5"></i> Estudar PDF
              </button>
            `;
          } else if (isVideo) {
            actionBtn = `
              <button onclick="startStudy('${t._id}')" class="px-4 py-2 bg-gradient-to-r from-amber-500 to-orange-500 text-white font-bold rounded-xl text-xs hover:opacity-90 transition-all flex items-center gap-1 shadow-md shadow-amber-500/20">
                <i data-feather="play" class="w-3.5 h-3.5"></i> Assistir Aula
              </button>
            `;
          } else {
            actionBtn = `
              <button onclick="startStudy('${t._id}')" class="px-4 py-2 bg-gradient-to-r from-indigo-500 to-pink-500 text-white font-bold rounded-xl text-xs hover:opacity-90 transition-all flex items-center gap-1 shadow-md shadow-indigo-500/20">
                <i data-feather="external-link" class="w-3.5 h-3.5"></i> Abrir Conteúdo
              </button>
            `;
          }

          return `
            <div class="glass p-5 rounded-2xl flex flex-col justify-between border border-slate-200 dark:border-white/5 gap-3 hover:-translate-y-0.5 transition-transform duration-200">
              <div>
                <div class="flex items-center justify-between mb-2">
                  <span class="px-2 py-0.5 rounded-full font-bold text-[9px] uppercase tracking-wider ${badgeColor}">${badgeType}</span>
                  <span class="text-xs text-indigo-500 font-semibold">${t.materia}</span>
                </div>
                <h3 class="text-sm font-bold font-outfit text-slate-800 dark:text-slate-100 line-clamp-1">${t.titulo}</h3>
                ${t.assunto ? `<p class="text-xs text-slate-500 dark:text-slate-400 mt-1 line-clamp-1">${t.assunto}</p>` : ''}
              </div>
              <div class="flex items-center justify-between mt-1 border-t border-slate-100 dark:border-white/5 pt-2">
                <span class="text-[10px] text-slate-400 font-semibold truncate max-w-[120px]">${t.subassunto || ''}</span>
                ${actionBtn}
              </div>
            </div>
          `;
        }).join('');
        feather.replace();
      } catch (err) {
        console.error('Falha ao carregar materiais na página de questões:', err);
      }
    }

    function startStudy(contentId) {
      localStorage.setItem('currentContentId', contentId);
      window.location.href = 'study.html';
    }

    loadFeaturedMaterials();

    document.getElementById('exerciseForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const materia = document.getElementById('materia').value;
      const assunto = document.getElementById('assunto').value;
      const btn = document.getElementById('genBtn');
      const resultContainer = document.getElementById('resultContainer');
      const contentDiv = document.getElementById('exerciseContent');

      btn.disabled = true;
      btn.innerHTML = '<i data-feather="loader" class="w-5 h-5 animate-spin"></i> Elaborando questão...';
      feather.replace();

      try {
        const data = await App.api('/api/chat/exercise', {
          method: 'POST',
          body: JSON.stringify({ materia, assunto })
        });

        contentDiv.innerHTML = marked.parse(data.resposta);
        resultContainer.classList.remove('hidden');
        resultContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });

        App.showToast('Questão gerada com sucesso! Salva no histórico.');
      } catch (err) {
        App.showToast(err.message, true);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i data-feather="zap" class="w-5 h-5"></i> Gerar Questão Inédita';
        feather.replace();
      }
    });
  </script>
</body>
</html>
