<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07060e">
  <title>EnemFlow AI - Plano de Estudos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/feather-icons"></script>
  <script src="sidebar.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
  <style>
    .selected-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      background: rgba(236, 72, 153, 0.15);
      color: #f472b6;
      border: 1px solid rgba(236, 72, 153, 0.25);
      animation: tag-pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .selected-tag .remove-btn {
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .selected-tag .remove-btn:hover {
      opacity: 1;
    }
    @keyframes tag-pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
  <link rel="icon" type="image/png" href="favicon.png?v=2">
</head>
<body class="flex h-screen overflow-hidden ef-deep-bg" style="font-family:'Inter',sans-serif;">

  <!-- Mobile Header -->
  <div class="lg:hidden fixed top-0 w-full glass z-40 px-4 py-3 flex items-center justify-between border-b">
    <button onclick="window.location.href='dashboard.html'" class="p-2 bg-slate-100 dark:bg-white/5 rounded-lg">
      <i data-feather="arrow-left" class="w-5 h-5"></i>
    </button>
    <div class="flex items-center gap-2">
      <i data-feather="calendar" class="text-pink-500 w-5 h-5"></i>
      <span class="font-bold">Plano de <span class="text-gradient">Estudos</span></span>
    </div>
    <div class="w-9"></div>
  </div>



  <main class="flex-1 overflow-y-auto relative pt-16 lg:pt-8 pb-20 lg:pl-8">
    <div class="bg-glow top-[10%] right-[30%] bg-pink-500/20"></div>
    
    <div class="max-w-4xl mx-auto p-4 md:p-6">
      
      <div class="text-center mb-10 animate-fade-in">
        <div class="w-16 h-16 rounded-2xl bg-pink-500/10 flex items-center justify-center mx-auto mb-4 border border-pink-500/20 shadow-[0_0_30px_rgba(236,72,153,0.2)]">
          <i data-feather="map" class="w-8 h-8 text-pink-500"></i>
        </div>
        <h1 class="text-3xl font-bold mb-2" style="font-family:'Sora',sans-serif;"><span class="text-gradient">Cronograma Personalizado</span></h1>
        <p style="color:rgba(196,188,220,0.5);">Organize sua rotina de estudos com a ajuda da IA.</p>
      </div>

      <div class="glass-card p-6 md:p-8 mb-8 animate-fade-in" style="animation-delay: 0.1s;">
        <form id="planForm" class="space-y-6">
          
          <div>
            <label class="text-sm font-semibold text-slate-300 block mb-2 font-sora">Selecione as Matérias (foco)</label>
            <div class="relative">
              <div id="multiSelectTrigger" class="min-h-[46px] w-full px-4 py-2.5 rounded-xl bg-white/5 dark:bg-black/40 border border-slate-200/50 dark:border-white/10 backdrop-blur-md outline-none focus-within:ring-2 focus-within:ring-pink-500 flex flex-wrap gap-2 items-center cursor-pointer transition-all hover:bg-white/10">
                <div id="selectedTagsContainer" class="flex flex-wrap gap-1.5"></div>
                <span id="placeholderText" class="text-sm text-slate-500 dark:text-slate-400 select-none">Escolha uma ou mais matérias...</span>
                <i data-feather="chevron-down" class="w-4 h-4 ml-auto text-slate-500 dark:text-slate-400 shrink-0"></i>
              </div>
              <div id="multiSelectDropdown" class="hidden absolute left-0 w-full mt-2 rounded-xl bg-slate-50/95 dark:bg-[#1a162b]/95 backdrop-blur-xl border border-slate-200/50 dark:border-white/10 shadow-2xl z-50 max-h-56 overflow-y-auto p-1.5 animate-fade-in">              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-2">
              <label class="text-sm font-medium text-slate-700 dark:text-slate-300 block mb-2 font-sora">Tempo disponível por dia</label>
              <div class="relative custom-select" id="tempoSelect">
                <div class="select-trigger w-full px-4 py-3 rounded-xl bg-white/5 dark:bg-black/40 border border-slate-200/50 dark:border-white/10 backdrop-blur-md outline-none focus-within:ring-2 focus-within:ring-pink-500 flex justify-between items-center cursor-pointer transition-all hover:bg-white/10">
                  <span class="selected-text text-sm text-slate-700 dark:text-slate-300">2 horas</span>
                  <i data-feather="chevron-down" class="w-4 h-4 text-slate-500 dark:text-slate-400"></i>
                </div>
                <div class="select-dropdown hidden absolute left-0 w-full bottom-full mb-2 rounded-xl bg-slate-50/95 dark:bg-[#1a162b]/95 backdrop-blur-xl border border-slate-200/50 dark:border-white/10 shadow-2xl z-50 p-1.5 animate-fade-in">
                  <!-- JS will populate -->
                </div>
              </div>
              <div id="customTempoContainer" class="hidden mt-3 animate-fade-in">
                <input type="text" id="customTempoInput" placeholder="Digite seu tempo. Ex: 3 horas e 30 min" class="w-full px-4 py-3 rounded-xl bg-white/5 dark:bg-black/40 border border-slate-200/50 dark:border-white/10 backdrop-blur-md outline-none focus:ring-2 focus:ring-pink-500 text-sm text-slate-700 dark:text-slate-300 placeholder-slate-500">
              </div>
            </div>
            
            <div class="space-y-2">
              <label class="text-sm font-medium text-slate-700 dark:text-slate-300 block mb-2 font-sora">Seu nível atual</label>
              <div class="relative custom-select" id="nivelSelect">
                <div class="select-trigger w-full px-4 py-3 rounded-xl bg-white/5 dark:bg-black/40 border border-slate-200/50 dark:border-white/10 backdrop-blur-md outline-none focus-within:ring-2 focus-within:ring-pink-500 flex justify-between items-center cursor-pointer transition-all hover:bg-white/10">
                  <span class="selected-text text-sm text-slate-700 dark:text-slate-300">Intermediário (Já vi algo)</span>
                  <i data-feather="chevron-down" class="w-4 h-4 text-slate-500 dark:text-slate-400"></i>
                </div>
                <div class="select-dropdown hidden absolute left-0 w-full bottom-full mb-2 rounded-xl bg-slate-50/95 dark:bg-[#1a162b]/95 backdrop-blur-xl border border-slate-200/50 dark:border-white/10 shadow-2xl z-50 p-1.5 animate-fade-in">
                  <!-- JS will populate -->
                </div>
              </div>
            </div>
          </div>

          <button type="submit" id="genBtn" class="w-full py-4 bg-gradient-to-r from-pink-500 to-rose-500 hover:opacity-90 text-white rounded-xl font-semibold shadow-lg shadow-pink-500/30 transition-all flex justify-center items-center gap-2">
            <i data-feather="calendar" class="w-5 h-5"></i> Montar Meu Cronograma
          </button>
        </form>
      </div>

      <div id="resultContainer" class="hidden">
        <h2 class="text-lg font-bold mb-4 flex items-center gap-2 border-b border-slate-200 dark:border-white/10 pb-2">
          <i data-feather="flag" class="text-pink-500 w-5 h-5"></i> Seu Plano Estratégico
        </h2>
        
        <div class="glass border-l-4 border-l-pink-500 rounded-r-2xl p-6 md:p-8 relative">
          <div id="planContent" class="prose prose-slate dark:prose-invert max-w-none prose-p:leading-relaxed prose-headings:text-pink-500 prose-table:w-full prose-th:bg-slate-100 dark:prose-th:bg-white/10 prose-th:p-2 prose-td:p-2 prose-td:border-b dark:prose-td:border-white/10"></div>
        </div>
      </div>

    </div>
  </main>
  <script src="app.js"></script>
  <script>
    feather.replace();
    if(!App.getToken()) window.location.href = 'login.html';

    // Modern Multi-Select Dropdown Logic
    const materiasList = [
      "Matemática", "Português", "Física", "Química", "Biologia", 
      "História", "Geografia", "Sociologia", "Filosofia", "Artes", 
      "Literatura", "Inglês", "Espanhol", "Redação", "Educação Física"
    ];
    let selectedMaterias = [];

    // Custom Select Options
    const tempoOptions = [
      { value: "1 hora", label: "1 hora" },
      { value: "2 horas", label: "2 horas" },
      { value: "4 horas", label: "4 horas" },
      { value: "Integral (+6h)", label: "Integral (+6h)" },
      { value: "Personalizado", label: "Personalizado..." }
    ];
    
    const nivelOptions = [
      { value: "Iniciante", label: "Iniciante (Começando agora)" },
      { value: "Intermediário", label: "Intermediário (Já vi algo)" },
      { value: "Avançado", label: "Avançado (Foco em revisão/exercícios)" }
    ];

    let currentTempo = "2 horas";
    let currentNivel = "Intermediário";

    // Load saved inputs on load
    try {
      const savedMaterias = localStorage.getItem('plan_selectedMaterias');
      if (savedMaterias) {
        selectedMaterias = JSON.parse(savedMaterias);
      }
    } catch (e) {
      console.error('Error parsing saved materias:', e);
    }

    const trigger = document.getElementById('multiSelectTrigger');
    const dropdown = document.getElementById('multiSelectDropdown');
    const selectedTagsContainer = document.getElementById('selectedTagsContainer');
    const placeholderText = document.getElementById('placeholderText');

    trigger.addEventListener('click', (e) => {
      dropdown.classList.toggle('hidden');
    });

    document.addEventListener('click', (e) => {
      if (!trigger.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.classList.add('hidden');
      }
      
      document.querySelectorAll('.custom-select').forEach(select => {
        const t = select.querySelector('.select-trigger');
        const d = select.querySelector('.select-dropdown');
        if (!t.contains(e.target) && !d.contains(e.target)) {
          d.classList.add('hidden');
        }
      });
    });

    function setupCustomSelect(selectId, options, currentValue, onSelect) {
      const container = document.getElementById(selectId);
      const selTrigger = container.querySelector('.select-trigger');
      const selDropdown = container.querySelector('.select-dropdown');
      const selText = container.querySelector('.selected-text');

      selTrigger.addEventListener('click', () => {
        selDropdown.classList.toggle('hidden');
      });

      function render() {
        selDropdown.innerHTML = '';
        const currentLabel = options.find(o => o.value === currentValue)?.label || currentValue;
        selText.textContent = currentLabel;

        options.forEach(opt => {
          const isSelected = opt.value === currentValue;
          const item = document.createElement('div');
          item.className = `px-3 py-2.5 mx-1 my-0.5 rounded-lg cursor-pointer text-sm font-medium flex items-center justify-between transition-all ${isSelected ? 'bg-pink-500/10 dark:bg-pink-500/20 text-pink-600 dark:text-pink-400' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-white/5'}`;
          item.innerHTML = `
            <span>${opt.label}</span>
            <i data-feather="check" class="w-4 h-4 text-pink-500 ${isSelected ? '' : 'hidden'}"></i>
          `;
          item.onclick = () => {
            currentValue = opt.value;
            onSelect(currentValue);
            selDropdown.classList.add('hidden');
            render();
          };
          selDropdown.appendChild(item);
        });
        if (typeof feather !== 'undefined') feather.replace();
      }
      
      render();
      return {
        setValue: (val) => {
          currentValue = val;
          render();
        }
      };
    }

    const tempoSelectCtrl = setupCustomSelect('tempoSelect', tempoOptions, currentTempo, (val) => {
      currentTempo = val;
      localStorage.setItem('plan_tempo', val);
      const customContainer = document.getElementById('customTempoContainer');
      if (val === 'Personalizado') {
        customContainer.classList.remove('hidden');
      } else {
        customContainer.classList.add('hidden');
      }
    });

    const nivelSelectCtrl = setupCustomSelect('nivelSelect', nivelOptions, currentNivel, (val) => {
      currentNivel = val;
      localStorage.setItem('plan_dificuldade', val);
    });

    function renderDropdownItems() {
      dropdown.innerHTML = '';
      materiasList.forEach(m => {
        const isSelected = selectedMaterias.includes(m);
        const item = document.createElement('div');
        item.className = `px-3 py-2.5 mx-1 my-0.5 rounded-lg cursor-pointer text-sm font-medium flex items-center justify-between transition-all ${isSelected ? 'bg-pink-500/10 dark:bg-pink-500/20 text-pink-600 dark:text-pink-400' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-white/5'}`;
        item.innerHTML = `
          <span>${m}</span>
          <i data-feather="check" class="w-4 h-4 text-pink-500 ${isSelected ? '' : 'hidden'}"></i>
        `;
        item.onclick = () => toggleSelectMateria(m);
        dropdown.appendChild(item);
      });
      if (typeof feather !== 'undefined') feather.replace();
    }

    function toggleSelectMateria(materia) {
      if (selectedMaterias.includes(materia)) {
        selectedMaterias = selectedMaterias.filter(x => x !== materia);
      } else {
        selectedMaterias.push(materia);
      }
      localStorage.setItem('plan_selectedMaterias', JSON.stringify(selectedMaterias));
      updateTags();
      renderDropdownItems();
    }

    function updateTags() {
      selectedTagsContainer.innerHTML = '';
      if (selectedMaterias.length > 0) {
        placeholderText.classList.add('hidden');
        selectedMaterias.forEach(m => {
          const tag = document.createElement('span');
          tag.className = 'selected-tag';
          tag.innerHTML = `${m} <span class="remove-btn font-bold ml-1" onclick="event.stopPropagation(); removeMateria('${m}')">✕</span>`;
          selectedTagsContainer.appendChild(tag);
        });
      } else {
        placeholderText.classList.remove('hidden');
      }
    }

    window.removeMateria = function(materia) {
      selectedMaterias = selectedMaterias.filter(x => x !== materia);
      localStorage.setItem('plan_selectedMaterias', JSON.stringify(selectedMaterias));
      updateTags();
      renderDropdownItems();
    }

    // Restore custom input values
    const savedTempo = localStorage.getItem('plan_tempo');
    if (savedTempo) {
      currentTempo = savedTempo;
      tempoSelectCtrl.setValue(savedTempo);
      if (savedTempo === 'Personalizado') {
        document.getElementById('customTempoContainer').classList.remove('hidden');
        const customVal = localStorage.getItem('plan_tempo_custom');
        if (customVal) document.getElementById('customTempoInput').value = customVal;
      }
    }
    const savedDificuldade = localStorage.getItem('plan_dificuldade');
    if (savedDificuldade) {
      currentNivel = savedDificuldade;
      nivelSelectCtrl.setValue(savedDificuldade);
    }
    
    document.getElementById('customTempoInput').addEventListener('input', (e) => {
      localStorage.setItem('plan_tempo_custom', e.target.value);
    });

    updateTags();
    renderDropdownItems();

    // Restore previously generated content
    const planVisible = localStorage.getItem('plan_visible') === 'true';
    const savedPlanContent = localStorage.getItem('plan_content');
    if (planVisible && savedPlanContent) {
      const resultContainer = document.getElementById('resultContainer');
      const contentDiv = document.getElementById('planContent');
      contentDiv.innerHTML = savedPlanContent;
      resultContainer.classList.remove('hidden');
    }

    document.getElementById('planForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      if (selectedMaterias.length === 0) return App.showToast('Selecione ao menos uma matéria.', true);

      let tempoDisponivel = currentTempo;
      if (tempoDisponivel === 'Personalizado') {
        const customVal = document.getElementById('customTempoInput').value.trim();
        if (!customVal) return App.showToast('Por favor, digite seu tempo personalizado.', true);
        tempoDisponivel = customVal;
      }
      
      const dificuldade = currentNivel;
      const btn = document.getElementById('genBtn');
      const resultContainer = document.getElementById('resultContainer');
      const contentDiv = document.getElementById('planContent');

      btn.disabled = true;
      btn.innerHTML = '<i data-feather="loader" class="w-5 h-5 animate-spin"></i> Analisando e planejando...';
      feather.replace();

      try {
        const data = await App.api('/api/plan', {
          method: 'POST',
          body: JSON.stringify({ materias: selectedMaterias, tempoDisponivel, dificuldade })
        });

        const parsedHtml = marked.parse(data.cronograma);
        contentDiv.innerHTML = parsedHtml;
        resultContainer.classList.remove('hidden');
        resultContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });

        // Save generated plan state
        localStorage.setItem('plan_content', parsedHtml);
        localStorage.setItem('plan_visible', 'true');

        App.showToast('Cronograma criado! Salvo na sua conta.');
      } catch (err) {
        App.showToast(err.message, true);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i data-feather="calendar" class="w-5 h-5"></i> Montar Meu Cronograma';
        feather.replace();
      }
    });
  </script>
</body>
</html>
