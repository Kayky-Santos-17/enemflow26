<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EnemFlow AI - Perfil</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/feather-icons"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], sora: ['Sora', 'sans-serif'] } } }
    }
  </script>
</head>
<body class="min-h-screen ef-deep-bg" style="font-family:'Inter',sans-serif;">

  <main class="flex-1 overflow-y-auto relative min-h-screen">
    <div class="bg-glow" style="top:-5%;right:10%;"></div>
    <div class="bg-glow" style="bottom:10%;left:-5%;background:radial-gradient(circle,rgba(244,114,182,0.05) 0%,transparent 60%);"></div>

    <div class="p-6 md:p-10 max-w-4xl mx-auto space-y-6 animate-fade-in relative z-10">

      <!-- Header -->
      <header class="pb-5" style="border-bottom:1px solid rgba(124,92,252,0.08);">
        <h1 class="text-2xl font-extrabold tracking-tight mb-1" style="font-family:'Sora',sans-serif;">
          <span class="text-gradient">Meu Perfil</span>
        </h1>
        <p style="color:rgba(196,188,220,0.5);font-size:0.9rem;">Gerencie suas informações e personalize sua experiência.</p>
      </header>

      <!-- Profile Card with Avatar + Stats -->
      <div class="glass-card p-6 md:p-8">
        <div class="flex flex-col md:flex-row items-center gap-6">
          <!-- Avatar -->
          <div class="relative group">
            <div id="avatarPreview" class="w-28 h-28 rounded-full flex items-center justify-center font-bold text-4xl bg-cover bg-center shrink-0" style="background-color:rgba(124,92,252,0.15);color:#a78bfa;font-family:'Sora',sans-serif;border:3px solid rgba(124,92,252,0.2);box-shadow:0 0 30px rgba(124,92,252,0.1);">?</div>
            <input type="file" id="fotoUpload" accept="image/*" style="display:none;" onchange="uploadFoto()">
            <button onclick="document.getElementById('fotoUpload').click()" id="uploadBtn" class="absolute bottom-0 right-0 w-9 h-9 rounded-full flex items-center justify-center transition-all" style="background:linear-gradient(135deg,#7c5cfc,#a855f7);color:white;border:2px solid rgba(7,6,14,1);box-shadow:0 4px 12px rgba(124,92,252,0.3);" title="Alterar Foto">
              <i data-feather="camera" class="w-4 h-4"></i>
            </button>
          </div>

          <!-- User Info + Stats -->
          <div class="flex-1 text-center md:text-left">
            <h2 id="userNameDisplay" class="text-xl font-bold mb-1" style="font-family:'Sora',sans-serif;color:#e4dff0;">Carregando...</h2>
            <p id="userEmailDisplay" class="text-sm mb-4" style="color:rgba(196,188,220,0.4);">...</p>
            
            <!-- XP + Level + Stats Row -->
            <div class="flex flex-wrap gap-3 justify-center md:justify-start">
              <div class="xp-badge">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor" style="color:#a78bfa;"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                <span id="profileXp" style="font-family:'Sora',sans-serif;">0 XP</span>
              </div>
              <div class="xp-badge" style="background:rgba(168,85,247,0.08);border-color:rgba(168,85,247,0.15);color:#d8b4fe;">
                <i data-feather="award" class="w-3 h-3"></i>
                <span id="profileLevel" style="font-family:'Sora',sans-serif;">Nível 1</span>
              </div>
              <div class="xp-badge" style="background:rgba(16,185,129,0.08);border-color:rgba(16,185,129,0.15);color:#6ee7b7;">
                <i data-feather="clock" class="w-3 h-3"></i>
                <span id="profileStudyTime" style="font-family:'Sora',sans-serif;">0h estudadas</span>
              </div>
            </div>

            <!-- XP Progress Bar -->
            <div class="mt-4 w-full max-w-sm" id="xpProgressArea">
              <div class="flex items-center justify-between mb-1">
                <span class="text-[10px] font-bold" style="color:rgba(167,139,250,0.5);font-family:'Sora',sans-serif;" id="xpProgressLabel">0 / 100 XP</span>
                <span class="text-[10px] font-bold" style="color:rgba(167,139,250,0.3);font-family:'Sora',sans-serif;" id="xpNextLevel">Próximo: Nível 2</span>
              </div>
              <div class="w-full h-2 rounded-full overflow-hidden" style="background:rgba(124,92,252,0.08);">
                <div id="xpProgressBar" class="h-full rounded-full transition-all duration-700" style="width:0%;background:linear-gradient(90deg,#7c5cfc,#a855f7,#c084fc);"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Edit Profile Form -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="glass-card p-6">
          <h3 class="text-base font-bold mb-4 flex items-center gap-2" style="font-family:'Sora',sans-serif;color:#e4dff0;">
            <i data-feather="user" class="w-4 h-4" style="color:#a78bfa;"></i> Informações Pessoais
          </h3>
          <form id="perfil-form" class="space-y-4">
            <div>
              <label class="text-xs font-semibold block mb-1.5" style="color:rgba(196,188,220,0.5);">Nome de Exibição</label>
              <input type="text" id="nomeInput" required class="w-full px-4 py-2.5 rounded-xl outline-none text-sm transition-all" style="background:rgba(12,10,22,0.6);border:1px solid rgba(124,92,252,0.1);color:#e4dff0;font-family:'Inter',sans-serif;" onfocus="this.style.borderColor='rgba(124,92,252,0.4)';this.style.boxShadow='0 0 0 3px rgba(124,92,252,0.1)'" onblur="this.style.borderColor='rgba(124,92,252,0.1)';this.style.boxShadow='none'">
            </div>
            <div>
              <label class="text-xs font-semibold block mb-1.5" style="color:rgba(196,188,220,0.35);">E-mail (não editável)</label>
              <input type="email" id="emailInput" disabled class="w-full px-4 py-2.5 rounded-xl text-sm cursor-not-allowed" style="background:rgba(12,10,22,0.3);border:1px solid rgba(124,92,252,0.05);color:rgba(196,188,220,0.3);">
            </div>
            <button type="submit" class="btn btn-primary w-full mt-2" id="saveBtn" style="font-family:'Sora',sans-serif;">Salvar Alterações</button>
          </form>
        </div>

        <!-- Security + Preferences -->
        <div class="space-y-6">
          <div class="glass-card p-6">
            <h3 class="text-base font-bold mb-4 flex items-center gap-2" style="font-family:'Sora',sans-serif;color:#e4dff0;">
              <i data-feather="lock" class="w-4 h-4" style="color:#f472b6;"></i> Segurança
            </h3>
            <button type="button" onclick="togglePasswordSection()" class="w-full px-4 py-2.5 rounded-xl text-sm font-semibold flex items-center justify-between transition-all" style="background:rgba(124,92,252,0.04);border:1px solid rgba(124,92,252,0.08);color:rgba(196,188,220,0.6);">
              Alterar Senha
              <i data-feather="chevron-down" class="w-4 h-4"></i>
            </button>
            <div id="password-section" style="display:none;margin-top:1rem;padding:1.25rem;border-radius:12px;background:rgba(239,68,68,0.04);border:1px solid rgba(239,68,68,0.1);animation:slideDown 0.3s ease-out;">
              <div class="space-y-3">
                <div>
                  <label class="text-xs font-semibold block mb-1" style="color:rgba(248,113,113,0.7);">Senha Atual</label>
                  <input type="password" id="senhaAtual" placeholder="Digite sua senha atual" autocomplete="off" class="w-full px-3 py-2 rounded-lg text-sm outline-none" style="background:rgba(0,0,0,0.3);border:1px solid rgba(239,68,68,0.15);color:#e4dff0;">
                </div>
                <div>
                  <label class="text-xs font-semibold block mb-1" style="color:rgba(248,113,113,0.7);">Nova Senha</label>
                  <input type="password" id="novaSenha" placeholder="Mínimo 6 caracteres" autocomplete="new-password" class="w-full px-3 py-2 rounded-lg text-sm outline-none" style="background:rgba(0,0,0,0.3);border:1px solid rgba(239,68,68,0.15);color:#e4dff0;">
                </div>
                <button type="button" onclick="updatePassword()" class="w-full py-2.5 rounded-lg text-sm font-bold transition-all" style="background:#ef4444;color:white;box-shadow:0 4px 12px rgba(239,68,68,0.2);" id="passBtn">Confirmar Alteração</button>
              </div>
            </div>
          </div>

          <div class="glass-card p-6">
            <h3 class="text-base font-bold mb-4 flex items-center gap-2" style="font-family:'Sora',sans-serif;color:#e4dff0;">
              <i data-feather="sun" class="w-4 h-4" style="color:#c084fc;"></i> Aparência
            </h3>
            <div class="flex items-center justify-between p-3 rounded-xl" style="background:rgba(124,92,252,0.04);border:1px solid rgba(124,92,252,0.08);">
              <div>
                <p class="text-sm font-semibold" style="color:#e4dff0;">Tema do Sistema</p>
                <p class="text-[11px]" style="color:rgba(196,188,220,0.4);">Escolha sua preferência visual.</p>
              </div>
              <!-- Segmented Theme Switcher (Sol / Lua) -->
              <div class="flex items-center bg-black/40 p-1 rounded-xl border border-white/5 relative shrink-0">
                <!-- Sliding highlight background pill -->
                <div id="theme-indicator" class="absolute top-1 bottom-1 rounded-lg transition-all duration-300 bg-violet-600/35 border border-violet-500/30"></div>
                
                <button type="button" onclick="setThemeMode('light')" id="theme-btn-light" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all relative z-10 text-slate-400">
                  <i data-feather="sun" class="w-3.5 h-3.5"></i>
                  <span>Claro</span>
                </button>
                
                <button type="button" onclick="setThemeMode('dark')" id="theme-btn-dark" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all relative z-10 text-slate-400">
                  <i data-feather="moon" class="w-3.5 h-3.5"></i>
                  <span>Escuro</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Logout mobile -->
      <button onclick="App.logout()" class="btn btn-danger w-full md:hidden" style="margin-top:1rem;font-weight:700;">Sair da Conta</button>

    </div>
  </main>

  <script src="app.js"></script>
  <script src="sidebar.js" defer></script>
  <script>
    feather.replace();
    if(!App.getToken()) window.location.href = 'login.html';

    let currentAvatarUrl = '';

    function getLevel(xp) { return Math.floor(xp / 100) + 1; }

    async function loadData() {
      try {
        const user = await App.api('/auth/me');
        document.getElementById('nomeInput').value = user.nome;
        document.getElementById('emailInput').value = user.email;
        document.getElementById('userNameDisplay').innerText = user.nome;
        document.getElementById('userEmailDisplay').innerText = user.email;
        currentAvatarUrl = user.avatarUrl || '';
        
        const xp = user.xp || 0;
        const level = getLevel(xp);
        const xpInLevel = xp % 100;
        document.getElementById('profileXp').textContent = `${xp} XP`;
        document.getElementById('profileLevel').textContent = `Nível ${level}`;
        document.getElementById('xpProgressLabel').textContent = `${xpInLevel} / 100 XP`;
        document.getElementById('xpNextLevel').textContent = `Próximo: Nível ${level + 1}`;
        document.getElementById('xpProgressBar').style.width = `${xpInLevel}%`;

        const avatarDiv = document.getElementById('avatarPreview');
        if (currentAvatarUrl) {
          avatarDiv.style.backgroundImage = `url(${currentAvatarUrl})`;
          avatarDiv.innerText = '';
        } else {
          avatarDiv.innerText = user.nome.charAt(0).toUpperCase();
        }

        // Load study time
        try {
          const sessions = await App.api(`/study/history/${user._id || ''}`);
          if (sessions && sessions.length) {
            const totalSec = sessions.reduce((a, s) => a + (s.duracao || 0), 0);
            const h = Math.floor(totalSec / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            document.getElementById('profileStudyTime').textContent = h > 0 ? `${h}h ${m}m` : `${m}m estudadas`;
          }
        } catch(e) {}
      } catch (err) {
        if(err.message.includes('Sessão') || err.message.includes('Token') || err.message.includes('Usuário')) App.logout();
      }
    }

    async function uploadFoto() {
      const fileInput = document.getElementById('fotoUpload');
      if (fileInput.files.length === 0) return;
      const btn = document.getElementById('uploadBtn');
      btn.disabled = true;
      try {
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        const uploadRes = await fetch(`${App.apiUrl}/upload`, {
          method: 'POST', headers: { 'Authorization': 'Bearer ' + App.getToken() }, body: formData
        });
        const uploadData = await uploadRes.json();
        if (!uploadRes.ok) throw new Error(uploadData.error || 'Erro no upload');
        currentAvatarUrl = uploadData.url;
        const avatarDiv = document.getElementById('avatarPreview');
        avatarDiv.style.backgroundImage = `url(${currentAvatarUrl})`;
        avatarDiv.innerText = '';
        App.showToast('Foto enviada! Não esqueça de salvar.');
      } catch (err) { App.showToast(err.message, true); }
      finally { btn.disabled = false; }
    }

    document.getElementById('perfil-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('saveBtn');
      btn.innerText = 'Salvando...'; btn.disabled = true;
      try {
        await App.api('/auth/me', {
          method: 'PUT', body: JSON.stringify({ nome: document.getElementById('nomeInput').value, avatarUrl: currentAvatarUrl })
        });
        App.showToast('Perfil atualizado com sucesso!');
        loadData();
      } catch (err) { App.showToast(err.message, true); }
      finally { btn.innerText = 'Salvar Alterações'; btn.disabled = false; }
    });

    function togglePasswordSection() {
      const section = document.getElementById('password-section');
      const isVisible = section.style.display !== 'none';
      section.style.display = isVisible ? 'none' : 'block';
      if (!isVisible) { document.getElementById('senhaAtual').value = ''; document.getElementById('novaSenha').value = ''; }
    }

    async function updatePassword() {
      const btn = document.getElementById('passBtn');
      const senhaAtual = document.getElementById('senhaAtual').value;
      const novaSenha = document.getElementById('novaSenha').value;
      if(!senhaAtual || !novaSenha) return App.showToast('Preencha os dois campos de senha.', true);
      if(novaSenha.length < 6) return App.showToast('A nova senha deve ter no mínimo 6 caracteres.', true);
      btn.innerText = 'Processando...'; btn.disabled = true;
      try {
        await App.api('/auth/password', { method: 'PUT', body: JSON.stringify({ senhaAtual, novaSenha }) });
        App.showToast('Senha atualizada com sucesso!');
        document.getElementById('senhaAtual').value = ''; document.getElementById('novaSenha').value = '';
        togglePasswordSection();
      } catch (err) { App.showToast(err.message, true); }
      finally { btn.innerText = 'Confirmar Alteração'; btn.disabled = false; }
    }

    function setThemeMode(mode) {
      const html = document.documentElement;
      const indicator = document.getElementById('theme-indicator');
      const btnLight = document.getElementById('theme-btn-light');
      const btnDark = document.getElementById('theme-btn-dark');
      
      if (!indicator || !btnLight || !btnDark) return;

      if (mode === 'light') {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        
        indicator.style.left = `${btnLight.offsetLeft}px`;
        indicator.style.width = `${btnLight.offsetWidth}px`;
        
        btnLight.classList.add('text-violet-300');
        btnLight.classList.remove('text-slate-400');
        btnDark.classList.remove('text-violet-300');
        btnDark.classList.add('text-slate-400');
      } else {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        
        indicator.style.left = `${btnDark.offsetLeft}px`;
        indicator.style.width = `${btnDark.offsetWidth}px`;
        
        btnDark.classList.add('text-violet-300');
        btnDark.classList.remove('text-slate-400');
        btnLight.classList.remove('text-violet-300');
        btnLight.classList.add('text-slate-400');
      }
    }

    function initThemeSwitcher() {
      const currentTheme = localStorage.getItem('theme') || 'dark';
      setTimeout(() => {
        setThemeMode(currentTheme);
      }, 100);
    }

    loadData();
    initThemeSwitcher();
  </script>
</body>
</html>
