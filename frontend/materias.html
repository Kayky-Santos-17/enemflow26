<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EnemFlow AI - Matérias</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/feather-icons"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { 
        extend: { 
          fontFamily: { 
            sans: ['Inter', 'sans-serif'],
            outfit: ['Outfit', 'sans-serif']
          } 
        } 
      }
    }
  </script>
</head>
<body class="min-h-screen bg-[#09090b]" style="color:#f0f0f5;">

  <!-- Main Content Area -->
  <main class="flex-1 overflow-y-auto relative p-6 md:p-10 max-w-6xl mx-auto space-y-8 animate-fade-in">
    <!-- Glowing background elements -->
    <div class="bg-glow top-[10%] right-[10%]"></div>
    <div class="bg-glow bottom-[20%] left-[5%]"></div>

    <header class="border-b border-slate-200 dark:border-white/10 pb-6">
      <h1 class="text-3xl font-extrabold font-outfit tracking-tight mb-2">📚 Matérias & Conteúdos</h1>
      <p class="text-slate-500 dark:text-slate-400">Navegue pelas matérias oficiais do ENEM, selecione os tópicos e inicie seus estudos imersivos com cronômetro.</p>
    </header>

    <!-- Nível 1: Matérias Grid (Side-by-side) -->
    <section id="materias-section">
      <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
        <i data-feather="grid" class="text-indigo-500 w-5 h-5"></i> Escolha uma Disciplina
      </h2>
      <div id="materias-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
        <!-- Renderizado dinamicamente via JS -->
        <div class="skeleton h-32 rounded-3xl"></div>
        <div class="skeleton h-32 rounded-3xl"></div>
        <div class="skeleton h-32 rounded-3xl"></div>
      </div>
    </section>

    <!-- Nível 2: Assuntos Grid (Side-by-side) - Inicialmente Oculto -->
    <section id="assuntos-section" class="hidden space-y-6">
      <div class="flex items-center justify-between border-t border-slate-200 dark:border-white/10 pt-8">
        <h2 class="text-xl font-bold flex items-center gap-2">
          <i data-feather="book" class="text-pink-500 w-5 h-5"></i> Assuntos de <span id="selected-materia-title" class="text-indigo-500 font-outfit font-extrabold"></span>
        </h2>
        <button onclick="backToMaterias()" class="px-4 py-2 text-xs font-semibold bg-slate-200 dark:bg-white/5 hover:bg-slate-300 dark:hover:bg-white/10 rounded-xl transition-all flex items-center gap-1.5 border border-slate-300 dark:border-white/10">
          <i data-feather="arrow-left" class="w-4 h-4"></i> Voltar para Matérias
        </button>
      </div>
      <div id="assuntos-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Renderizado dinamicamente via JS -->
      </div>
    </section>

    <!-- Nível 3: Tópicos & Materiais (Side-by-side) - Inicialmente Oculto -->
    <section id="topicos-section" class="hidden space-y-6">
      <div class="flex items-center justify-between border-t border-slate-200 dark:border-white/10 pt-8">
        <h2 class="text-xl font-bold flex items-center gap-2">
          <i data-feather="list" class="text-purple-500 w-5 h-5"></i> Tópicos de <span id="selected-assunto-title" class="text-pink-500 font-outfit font-extrabold"></span>
        </h2>
        <button onclick="backToAssuntos()" class="px-4 py-2 text-xs font-semibold bg-slate-200 dark:bg-white/5 hover:bg-slate-300 dark:hover:bg-white/10 rounded-xl transition-all flex items-center gap-1.5 border border-slate-300 dark:border-white/10">
          <i data-feather="arrow-left" class="w-4 h-4"></i> Voltar para Assuntos
        </button>
      </div>
      <div id="topicos-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Renderizado dinamicamente via JS -->
      </div>
    </section>

  </main>

  <script src="app.js"></script>
  <script src="sidebar.js" defer></script>
  <script>
    // Lista completa de matérias oficiais do ENEM
    const todasMaterias = [
      { nome: "Matemática", icon: "plus-circle", color: "from-blue-500 to-indigo-500" },
      { nome: "Física", icon: "zap", color: "from-amber-500 to-orange-500" },
      { nome: "Química", icon: "activity", color: "from-emerald-500 to-teal-500" },
      { nome: "Biologia", icon: "heart", color: "from-green-500 to-emerald-500" },
      { nome: "História", icon: "globe", color: "from-bronze-500 to-amber-700" },
      { nome: "Geografia", icon: "compass", color: "from-cyan-500 to-blue-600" },
      { nome: "Filosofia", icon: "help-circle", color: "from-purple-500 to-indigo-600" },
      { nome: "Sociologia", icon: "users", color: "from-pink-500 to-rose-600" },
      { nome: "Literatura", icon: "feather", color: "from-rose-500 to-pink-600" },
      { nome: "Português", icon: "edit-3", color: "from-indigo-500 to-purple-600" },
      { nome: "Redação", icon: "file-text", color: "from-violet-500 to-fuchsia-600" },
      { nome: "Artes", icon: "image", color: "from-yellow-400 to-orange-500" },
      { nome: "Inglês", icon: "type", color: "from-sky-500 to-blue-500" },
      { nome: "Espanhol", icon: "message-square", color: "from-orange-400 to-red-500" }
    ];

    let dbContents = [];
    let materiaSelecionada = '';
    let assuntoSelecionado = '';

    async function init() {
      try {
        dbContents = await App.api('/contents');
        renderMaterias();
      } catch (err) {
        App.showToast("Falha ao carregar conteúdos: " + err.message, true);
      }
    }

    function renderMaterias() {
      const grid = document.getElementById('materias-grid');
      grid.innerHTML = '';

      // Agrupa os conteúdos por matéria para contar
      const counts = {};
      dbContents.forEach(c => {
        if (c.materia) {
          counts[c.materia] = (counts[c.materia] || 0) + 1;
        }
      });

      // Filtra as matérias que possuem conteúdo (Requisito 11: Se não tiver nada, não aparece)
      const materiasAtivas = todasMaterias.filter(m => counts[m.nome] && counts[m.nome] > 0);

      if (materiasAtivas.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full glass-card p-10 text-center space-y-4">
            <div class="w-16 h-16 rounded-full bg-yellow-500/10 flex items-center justify-center mx-auto text-yellow-500">
              <i data-feather="alert-circle" class="w-8 h-8"></i>
            </div>
            <h3 class="text-xl font-bold font-outfit">Nenhum conteúdo publicado</h3>
            <p class="text-sm text-slate-500 max-w-sm mx-auto">Peça para um administrador cadastrar PDFs, vídeos ou artigos no painel master para que eles apareçam aqui!</p>
          </div>
        `;
        feather.replace();
        return;
      }

      materiasAtivas.forEach(m => {
        const total = counts[m.nome] || 0;
        const card = document.createElement('div');
        card.className = `glass-card p-6 cursor-pointer group hover:-translate-y-1.5 transition-all duration-300 flex items-center justify-between border-l-4 border-indigo-500 hover:shadow-lg hover:shadow-indigo-500/5`;
        card.onclick = () => selectMateria(m.nome);
        card.innerHTML = `
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br ${m.color} flex items-center justify-center text-white shrink-0 group-hover:scale-110 transition-transform">
              <i data-feather="${m.icon}" class="w-6 h-6"></i>
            </div>
            <div>
              <h3 class="text-lg font-bold font-outfit group-hover:text-indigo-500 transition-colors">${m.nome}</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">${total} conteúdo(s) ativo(s)</p>
            </div>
          </div>
          <i data-feather="chevron-right" class="w-5 h-5 text-slate-300 dark:text-slate-600 group-hover:text-indigo-500 transition-colors"></i>
        `;
        grid.appendChild(card);
      });
      feather.replace();
    }

    function selectMateria(materia) {
      materiaSelecionada = materia;
      document.getElementById('selected-materia-title').innerText = materia;

      // Filtra conteúdos desta matéria
      const filtrados = dbContents.filter(c => c.materia === materia);
      
      // Agrupa por assunto (Grid side-by-side)
      const assuntosMap = {};
      filtrados.forEach(c => {
        const assunto = c.assunto || 'Geral';
        if (!assuntosMap[assunto]) assuntosMap[assunto] = [];
        assuntosMap[assunto].push(c);
      });

      const grid = document.getElementById('assuntos-grid');
      grid.innerHTML = '';

      Object.keys(assuntosMap).forEach(assunto => {
        const list = assuntosMap[assunto];
        const card = document.createElement('div');
        card.className = "glass-card p-6 cursor-pointer group hover:-translate-y-1 transition-all border border-slate-200 dark:border-white/5 hover:border-pink-500/30";
        card.onclick = () => selectAssunto(assunto, list);
        card.innerHTML = `
          <div class="flex items-center justify-between mb-4">
            <div class="w-10 h-10 rounded-xl bg-pink-500/10 text-pink-500 flex items-center justify-center">
              <i data-feather="book-open" class="w-5 h-5"></i>
            </div>
            <span class="px-2.5 py-0.5 rounded-full bg-slate-100 dark:bg-white/5 font-semibold text-[10px] text-slate-500">${list.length} tópicos</span>
          </div>
          <h3 class="text-md font-bold font-outfit mb-2 truncate group-hover:text-pink-500 transition-colors">${assunto}</h3>
          <p class="text-xs text-slate-500 dark:text-slate-400">Clique para abrir os tópicos de estudo.</p>
        `;
        grid.appendChild(card);
      });

      document.getElementById('materias-section').classList.add('hidden');
      document.getElementById('assuntos-section').classList.remove('hidden');
      document.getElementById('topicos-section').classList.add('hidden');
      feather.replace();
    }

    function selectAssunto(assunto, topicos) {
      assuntoSelecionado = assunto;
      document.getElementById('selected-assunto-title').innerText = assunto;

      const grid = document.getElementById('topicos-grid');
      grid.innerHTML = '';

      topicos.forEach(t => {
        const card = document.createElement('div');
        card.className = "glass-card p-6 flex flex-col justify-between gap-4 border border-slate-200 dark:border-white/5";
        
        // Verifica mídias disponíveis (Requisito 11)
        const isPdf = t.url && t.url.startsWith('data:application/pdf') || (t.url && t.url.toLowerCase().endsWith('.pdf'));
        const isVideo = t.url && (t.url.includes('youtube.com') || t.url.includes('youtu.be') || t.url.toLowerCase().endsWith('.mp4'));
        const isText = !isPdf && !isVideo && t.url;

        // Badge de Tipo
        let badgeType = 'Artigo';
        let badgeColor = 'bg-blue-500/10 text-blue-500';
        if (isPdf) {
          badgeType = 'Material PDF';
          badgeColor = 'bg-red-500/10 text-red-500';
        } else if (isVideo) {
          badgeType = 'Vídeo Aula';
          badgeColor = 'bg-amber-500/10 text-amber-500';
        }

        // Apenas renderiza os botões se houver mídia real (Requisito 11)
        let actionButtonsHtml = '';
        if (isPdf) {
          actionButtonsHtml = `
            <button onclick="startStudy('${t._id}')" class="px-5 py-2.5 bg-gradient-to-r from-red-500 to-pink-500 hover:opacity-90 text-white font-bold rounded-xl text-xs shadow-lg shadow-red-500/20 transition-all flex items-center justify-center gap-1.5">
              <i data-feather="file-text" class="w-4 h-4"></i> Abrir Leitor PDF & Cronômetro
            </button>
          `;
        } else if (isVideo) {
          actionButtonsHtml = `
            <button onclick="startStudy('${t._id}')" class="px-5 py-2.5 bg-gradient-to-r from-amber-500 to-orange-500 hover:opacity-90 text-white font-bold rounded-xl text-xs shadow-lg shadow-amber-500/20 transition-all flex items-center justify-center gap-1.5">
              <i data-feather="play" class="w-4 h-4"></i> Assistir Vídeo & Cronômetro
            </button>
          `;
        } else if (t.url) {
          actionButtonsHtml = `
            <button onclick="startStudy('${t._id}')" class="px-5 py-2.5 bg-gradient-to-r from-indigo-500 to-pink-500 hover:opacity-90 text-white font-bold rounded-xl text-xs shadow-lg shadow-indigo-500/20 transition-all flex items-center justify-center gap-1.5">
              <i data-feather="external-link" class="w-4 h-4"></i> Iniciar Estudo Imersivo
            </button>
          `;
        }

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-3">
              <span class="px-2.5 py-0.5 rounded-full font-bold text-[10px] uppercase tracking-wider ${badgeColor}">${badgeType}</span>
              ${t.subassunto ? `<span class="text-xs text-slate-400 font-semibold font-outfit">${t.subassunto}</span>` : ''}
            </div>
            <h3 class="text-md font-bold font-outfit text-slate-800 dark:text-slate-100">${t.titulo}</h3>
          </div>
          <div class="flex items-center justify-end mt-2">
            ${actionButtonsHtml}
          </div>
        `;
        grid.appendChild(card);
      });

      document.getElementById('assuntos-section').classList.add('hidden');
      document.getElementById('topicos-section').classList.remove('hidden');
      feather.replace();
    }

    function startStudy(contentId) {
      localStorage.setItem('currentContentId', contentId);
      window.location.href = 'study.html';
    }

    function backToMaterias() {
      document.getElementById('materias-section').classList.remove('hidden');
      document.getElementById('assuntos-section').classList.add('hidden');
      document.getElementById('topicos-section').classList.add('hidden');
    }

    function backToAssuntos() {
      selectMateria(materiaSelecionada);
    }

    init();
  </script>
</body>
</html>
