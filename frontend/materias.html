<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EnemFlow AI - Matérias</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/feather-icons"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { 
        extend: { 
          fontFamily: { 
            sans: ['Inter', 'sans-serif'],
            sora: ['Sora', 'sans-serif']
          } 
        } 
      }
    }
  </script>
  <link rel="icon" type="image/png" href="favicon.png?v=2">
</head>
<body class="min-h-screen ef-deep-bg" style="font-family:'Inter',sans-serif;">

  <!-- Main Content Area -->
  <main class="flex-1 overflow-y-auto relative min-h-screen">
    <div class="bg-glow" style="top:5%;right:5%;"></div>
    <div class="bg-glow" style="bottom:15%;left:0%; background:radial-gradient(circle,rgba(168,85,247,0.05) 0%,transparent 60%);"></div>

    <div class="p-6 md:p-10 max-w-4xl mx-auto space-y-6 animate-fade-in relative z-10">

      <header class="pb-5" style="border-bottom:1px solid rgba(124,92,252,0.08);">
        <h1 class="text-2xl font-extrabold tracking-tight mb-1" style="font-family:'Sora',sans-serif;">
          <span class="text-gradient">Matérias & Conteúdos</span>
        </h1>
        <p style="color:rgba(196,188,220,0.5); font-size:0.9rem;">Navegue pelas disciplinas do ENEM, selecione tópicos e inicie seus estudos.</p>
      </header>

      <!-- Nível 1: Matérias Grid -->
      <section id="materias-section">
        <h2 class="text-base font-bold mb-4 flex items-center gap-2" style="font-family:'Sora',sans-serif; color:#e4dff0;">
          <i data-feather="grid" class="w-4 h-4" style="color:#a78bfa;"></i> Escolha uma Disciplina
        </h2>
        <div id="materias-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
          <div class="skeleton h-24 rounded-2xl"></div>
          <div class="skeleton h-24 rounded-2xl"></div>
          <div class="skeleton h-24 rounded-2xl"></div>
          <div class="skeleton h-24 rounded-2xl"></div>
        </div>
      </section>

      <!-- Nível 2: Assuntos -->
      <section id="assuntos-section" class="hidden space-y-5">
        <div class="flex items-center justify-between pt-5" style="border-top:1px solid rgba(124,92,252,0.08);">
          <h2 class="text-base font-bold flex items-center gap-2" style="font-family:'Sora',sans-serif; color:#e4dff0;">
            <i data-feather="book" class="w-4 h-4" style="color:#f472b6;"></i> Assuntos de <span id="selected-materia-title" class="text-gradient" style="margin-left:4px;"></span>
          </h2>
          <button onclick="backToMaterias()" class="px-3 py-1.5 text-xs font-semibold rounded-lg transition-all flex items-center gap-1.5" style="background:rgba(124,92,252,0.06); border:1px solid rgba(124,92,252,0.1); color:rgba(196,188,220,0.6);">
            <i data-feather="arrow-left" class="w-3.5 h-3.5"></i> Voltar
          </button>
        </div>
        <div id="assuntos-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3.5"></div>
      </section>

      <!-- Nível 3: Tópicos & Materiais -->
      <section id="topicos-section" class="hidden space-y-5">
        <div class="flex items-center justify-between pt-5" style="border-top:1px solid rgba(124,92,252,0.08);">
          <h2 class="text-base font-bold flex items-center gap-2" style="font-family:'Sora',sans-serif; color:#e4dff0;">
            <i data-feather="list" class="w-4 h-4" style="color:#c084fc;"></i> Tópicos de <span id="selected-assunto-title" class="text-gradient" style="margin-left:4px;"></span>
          </h2>
          <button onclick="backToAssuntos()" class="px-3 py-1.5 text-xs font-semibold rounded-lg transition-all flex items-center gap-1.5" style="background:rgba(124,92,252,0.06); border:1px solid rgba(124,92,252,0.1); color:rgba(196,188,220,0.6);">
            <i data-feather="arrow-left" class="w-3.5 h-3.5"></i> Voltar
          </button>
        </div>
        <div id="topicos-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </section>

    </div>
  </main>

  <script src="app.js"></script>
  <script src="sidebar.js" defer></script>
  <script>
    // Cores predefinidas para matérias conhecidas
    const coresMaterias = {
      "Matemática": "#8c52ff",
      "Física": "#ff66c4",
      "Química": "#00e5ff",
      "Biologia": "#00ffaa",
      "História": "#ff914d",
      "Geografia": "#38b6ff",
      "Sociologia": "#ff57a0",
      "Filosofia": "#cb6ce6",
      "Artes": "#ff00ff",
      "Literatura": "#b388ff",
      "Inglês": "#0080ff",
      "Redação": "#ff007f",
      "Português": "#8b5cf6",
      "Espanhol": "#f97316"
    };

    // Gera uma cor vibrante baseada no nome da matéria (para matérias novas)
    function gerarCor(nome) {
      let hash = 0;
      for (let i = 0; i < nome.length; i++) {
        hash = nome.charCodeAt(i) + ((hash << 5) - hash);
      }
      const h = Math.abs(hash) % 360;
      return `hsl(${h}, 70%, 55%)`;
    }

    function getCorMateria(nome) {
      return coresMaterias[nome] || gerarCor(nome);
    }

    let dbContents = [];
    let materiaSelecionada = '';
    let assuntoSelecionado = '';

    async function init() {
      try {
        dbContents = await App.api('/contents');
        renderMaterias();
      } catch (err) {
        App.showToast("Falha ao carregar conteúdos: " + err.message, true);
      }
    }

    function renderMaterias() {
      const grid = document.getElementById('materias-grid');
      grid.innerHTML = '';
      grid.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6";

      // Descobre TODAS as matérias que existem no banco de dados
      const counts = {};
      dbContents.forEach(c => {
        if (c.materia) {
          counts[c.materia] = (counts[c.materia] || 0) + 1;
        }
      });

      const materiasAtivas = Object.keys(counts).sort();

      if (materiasAtivas.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full glass-card p-8 text-center space-y-3">
            <h3 class="text-lg font-bold" style="font-family:'Inter',sans-serif; color:#e4dff0;">Nenhum conteúdo publicado</h3>
            <p class="text-sm" style="color:rgba(196,188,220,0.45); max-width:360px; margin:0 auto;">Peça para um administrador cadastrar PDFs, vídeos ou artigos no painel.</p>
          </div>
        `;
        return;
      }

      materiasAtivas.forEach((nome, idx) => {
        const total = counts[nome];
        const color = getCorMateria(nome);
        const card = document.createElement('div');
        
        card.className = "group relative overflow-hidden flex items-center justify-between cursor-pointer";
        card.style.cssText = `
          background: #0b0914;
          border: 1px solid rgba(255, 255, 255, 0.05);
          border-radius: 12px;
          padding: 24px;
          transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        `;
        
        card.onclick = () => selectMateria(nome);
        
        card.addEventListener('mouseenter', () => {
          card.style.transform = 'translateY(-8px) scale(1.02)';
          card.style.boxShadow = \`0 0 35px \${color}40\`;
          card.style.borderColor = \`\${color}50\`;
        });
        
        card.addEventListener('mouseleave', () => {
          card.style.transform = 'translateY(0) scale(1)';
          card.style.boxShadow = 'none';
          card.style.borderColor = 'rgba(255, 255, 255, 0.05)';
        });

        card.innerHTML = \`
          <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none" style="background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent); transform: skewX(-20deg); animation: shimmer 2s infinite;"></div>
          
          <div class="flex flex-col gap-[6px] relative z-10 w-full">
            <h3 style="color: \${color}; font-size: 1.15rem; font-weight: 600; font-family: 'Inter', sans-serif; letter-spacing: -0.01em; margin: 0;">\${nome}</h3>
            <div class="transition-all duration-500 rounded-full group-hover:w-8" style="background-color: \${color}; width: 14px; height: 2px;"></div>
            <span style="color: rgba(196,188,220,0.6); font-size: 0.75rem; font-weight: 400; margin-top: 2px;">\${total} conteúdos</span>
          </div>
          
          <svg class="relative z-10 transition-transform duration-500 group-hover:translate-x-1.5" style="color: rgba(255,255,255,0.7); width: 18px; height: 18px;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        \`;

        grid.appendChild(card);
      });

      if (!document.getElementById('card-shimmer')) {
        const style = document.createElement('style');
        style.id = 'card-shimmer';
        style.textContent = \`
          @keyframes shimmer {
            0% { transform: translateX(-150%) skewX(-20deg); }
            100% { transform: translateX(200%) skewX(-20deg); }
          }
        \`;
        document.head.appendChild(style);
      }
    }


    function selectMateria(materia) {
      materiaSelecionada = materia;
      document.getElementById('selected-materia-title').innerText = materia;

      const filtrados = dbContents.filter(c => c.materia === materia);
      
      const assuntosMap = {};
      filtrados.forEach(c => {
        const assunto = c.assunto || 'Geral';
        if (!assuntosMap[assunto]) assuntosMap[assunto] = [];
        assuntosMap[assunto].push(c);
      });

      const grid = document.getElementById('assuntos-grid');
      grid.innerHTML = '';

      Object.keys(assuntosMap).forEach(assunto => {
        const list = assuntosMap[assunto];
        const card = document.createElement('div');
        card.className = "glass-card p-3 cursor-pointer group transition-all duration-300 hover:scale-[1.03] hover:shadow-[0_0_20px_rgba(244,114,182,0.12)] hover:border-pink-500/30";
        card.onclick = () => selectAssunto(assunto, list);
        card.innerHTML = `
          <div class="flex items-center justify-between mb-2">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:rgba(244,114,182,0.08);">
              <i data-feather="book-open" class="w-3.5 h-3.5" style="color:#f472b6;"></i>
            </div>
            <span class="px-2 py-0.5 rounded-full font-semibold text-[9px]" style="background:rgba(124,92,252,0.06); color:rgba(196,188,220,0.5);">${list.length} tópicos</span>
          </div>
          <h3 class="text-xs font-bold truncate group-hover:text-[#f472b6] transition-colors" style="font-family:'Sora',sans-serif; color:#e4dff0;">${assunto}</h3>
        `;
        grid.appendChild(card);
      });

      document.getElementById('materias-section').classList.add('hidden');
      document.getElementById('assuntos-section').classList.remove('hidden');
      document.getElementById('topicos-section').classList.add('hidden');
      feather.replace();
    }

    function selectAssunto(assunto, topicos) {
      assuntoSelecionado = assunto;
      document.getElementById('selected-assunto-title').innerText = assunto;

      const grid = document.getElementById('topicos-grid');
      grid.innerHTML = '';

      topicos.forEach(t => {
        const card = document.createElement('div');
        
        const isPdf = t.tipo === 'pdf' || (t.url && t.url.startsWith('data:application/pdf')) || (t.url && t.url.toLowerCase().endsWith('.pdf'));
        const isVideo = t.tipo === 'video' || (t.url && (t.url.includes('youtube.com') || t.url.includes('youtu.be') || t.url.toLowerCase().endsWith('.mp4')));
        
        let type = 'artigo';
        if (isPdf) type = 'pdf';
        else if (isVideo) type = 'video';

        const typeIcons = {
          pdf: 'file-text',
          video: 'play',
          artigo: 'book-open',
          exercicio: 'check-square'
        };
        const typeNames = {
          pdf: 'Material PDF',
          video: 'Vídeo Aula',
          artigo: 'Artigo Teórico',
          exercicio: 'Exercício / Simulado'
        };
        const typeColors = {
          pdf: 'background: rgba(239, 68, 68, 0.08); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.15);',
          video: 'background: rgba(245, 158, 11, 0.08); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.15);',
          artigo: 'background: rgba(99, 102, 241, 0.08); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.15);',
          exercicio: 'background: rgba(16, 185, 129, 0.08); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.15);'
        };

        const badgeStyle = typeColors[type] || typeColors.artigo;
        const badgeName = typeNames[type] || typeNames.artigo;
        const iconName = typeIcons[type] || 'file-text';
        
        let buttonBg = 'linear-gradient(135deg,#7c5cfc,#a855f7)';
        let buttonShadow = 'rgba(124,92,252,0.25)';
        let leftBorderClass = 'border-l-indigo-500';
        
        if (type === 'pdf') {
          buttonBg = 'linear-gradient(135deg,#ef4444,#f87171)';
          buttonShadow = 'rgba(239,68,68,0.25)';
          leftBorderClass = 'border-l-red-500';
        } else if (type === 'video') {
          buttonBg = 'linear-gradient(135deg,#f59e0b,#f97316)';
          buttonShadow = 'rgba(245,158,11,0.25)';
          leftBorderClass = 'border-l-amber-500';
        }

        const buttonText = type === 'pdf' ? 'Estudar PDF' : type === 'video' ? 'Assistir Vídeo' : 'Ler Artigo';

        card.className = `glass-card p-5 border-l-4 ${leftBorderClass} flex flex-col justify-between gap-4 transition-all duration-300 hover:scale-[1.02] hover:shadow-[0_8px_30px_rgba(124,92,252,0.15)] hover:border-violet-500/30`;

        card.innerHTML = `
          <div class="space-y-3">
            <div class="flex items-center justify-between">
              <span class="px-2.5 py-0.5 rounded-full font-bold text-[9px] uppercase tracking-wider" style="${badgeStyle}">
                ${badgeName}
              </span>
              <div class="flex items-center gap-2 text-slate-400">
                ${t.tempoMedio ? `
                  <span class="flex items-center gap-1 text-[11px] font-medium" style="color: rgba(196,188,220,0.5);">
                    <i data-feather="clock" class="w-3 h-3"></i> ${t.tempoMedio} min
                  </span>` : ''}
                ${t.subassunto ? `<span class="text-[11px] font-semibold" style="color:rgba(196,188,220,0.4); font-family:'Sora',sans-serif;">${t.subassunto}</span>` : ''}
              </div>
            </div>
            
            <div class="space-y-1">
              <h3 class="text-sm font-bold leading-snug" style="font-family:'Sora',sans-serif; color:#e4dff0;">${t.titulo}</h3>
              ${t.descricao ? `<p class="text-xs leading-relaxed line-clamp-2" style="color: rgba(196,188,220,0.55);">${t.descricao}</p>` : ''}
            </div>
          </div>
          
          <div class="flex items-center justify-center border-t border-white/5 pt-4 mt-2">
            <button onclick="startStudy('${t._id}')" class="w-full py-3 text-white font-bold rounded-xl text-sm shadow-lg transition-all flex items-center justify-center gap-2 hover:scale-[1.02] active:scale-95" style="background:${buttonBg}; box-shadow:0 4px 15px ${buttonShadow};">
              <i data-feather="${iconName}" class="w-4 h-4"></i> ${buttonText}
            </button>
          </div>
        `;
        grid.appendChild(card);
      });

      document.getElementById('assuntos-section').classList.add('hidden');
      document.getElementById('topicos-section').classList.remove('hidden');
      feather.replace();
    }

    function startStudy(contentId) {
      localStorage.setItem('currentContentId', contentId);
      window.location.href = 'study.html';
    }

    function backToMaterias() {
      document.getElementById('materias-section').classList.remove('hidden');
      document.getElementById('assuntos-section').classList.add('hidden');
      document.getElementById('topicos-section').classList.add('hidden');
    }

    function backToAssuntos() {
      selectMateria(materiaSelecionada);
    }

    init();
  </script>
</body>
</html>
